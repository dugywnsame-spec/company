<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘도 출근 — 회사생활 시뮬레이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--ink:#1b2238;--sub:#6b7390;--line:#e4e8f2;--g-main:linear-gradient(135deg,#5b8cff,#8a5cff);--g-warm:linear-gradient(135deg,#ff7a59,#ffb347);--g-green:linear-gradient(135deg,#22c55e,#14b8a6);--g-red:linear-gradient(135deg,#ff5f6d,#ff9a5a);--g-gold:linear-gradient(135deg,#f6d365,#fda085)}
html,body{margin:0}
body{min-height:100vh;color:var(--ink);font-family:'Noto Sans KR',-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6;word-break:keep-all;
 background:radial-gradient(1000px 600px at 0% -10%,rgba(109,93,252,.45),transparent 60%),radial-gradient(800px 500px at 110% 0%,rgba(0,194,255,.28),transparent 60%),radial-gradient(900px 700px at 50% 120%,rgba(255,94,138,.22),transparent 60%),linear-gradient(160deg,#121735,#1e1b4b 55%,#0e2742);background-attachment:fixed}
#app{max-width:880px;margin:0 auto;padding:16px 14px 60px}
h1,h2,h3{margin:0;font-weight:400}
.disp{font-family:'Black Han Sans',sans-serif;font-weight:400;letter-spacing:.3px}
.dlg{font-family:'Gowun Dodum',sans-serif}
/* HUD */
.hud{background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:22px;color:#fff;padding:14px 16px 16px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.hud-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.cbadge{padding:4px 12px;border-radius:999px;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.hud-top .date{font-family:'Black Han Sans';font-size:18px;margin-left:auto}
.hud-top .age{opacity:.85}
.hud-mid{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.ava{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:32px;background:linear-gradient(135deg,rgba(255,255,255,.35),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.35);flex:none}
.nm{font-size:17px;font-weight:900}
.rank{font-family:'Black Han Sans';font-weight:400;font-size:13px;padding:2px 10px;border-radius:8px;margin-left:4px;color:#fff;vertical-align:2px}
.r0,.r1{background:linear-gradient(135deg,#64748b,#94a3b8)}.r2,.r3{background:linear-gradient(135deg,#0ea5e9,#6366f1)}.r4{background:linear-gradient(135deg,#8b5cf6,#ec4899)}.r5,.r6,.r7{background:linear-gradient(135deg,#f59e0b,#ef4444)}.r8{background:linear-gradient(135deg,#facc15,#f97316,#db2777)}
.moneyline{font-size:14px;opacity:.95}
.moneyline b{font-family:'Black Han Sans';font-weight:400;font-size:18px;letter-spacing:.3px}
.pills{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.pill{font-size:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);padding:3px 10px;border-radius:999px;white-space:nowrap}
.bars{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}
.bar .lbl{font-size:12px;display:flex;justify-content:space-between;opacity:.9}
.bar .lbl b{font-family:'Black Han Sans';font-weight:400;font-size:14px}
.trk{height:9px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden}
.fill{height:100%;border-radius:6px;transition:width .6s}
.fill.low{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
@media(max-width:640px){.bars{grid-template-columns:repeat(3,1fr)}.pills{margin-left:0;justify-content:flex-start}}
/* SCENE */
.scene{position:relative;height:270px;border-radius:22px;overflow:hidden;margin-bottom:14px;box-shadow:0 12px 34px rgba(5,10,40,.4);border:1px solid rgba(255,255,255,.2);isolation:isolate}
@media(max-width:640px){.scene{height:230px}}
.wall{position:absolute;inset:0;background:linear-gradient(180deg,#eef1fa,#dde3f1 60%);transition:background 1s}
.win{position:absolute;top:16px;left:22%;width:50%;height:44%;border-radius:12px;overflow:hidden;border:6px solid #cfd6e6;box-shadow:0 5px 0 #b3bdd3,inset 0 0 0 1px #fff}
.sky{position:absolute;inset:0;transition:background 1s}
.sun{position:absolute;width:34px;height:34px;border-radius:50%;top:16%;right:16%;background:radial-gradient(#fffbe0,#ffd36b);box-shadow:0 0 30px #ffd36b;transition:all 1.2s}
.stars{position:absolute;inset:0;opacity:0;transition:opacity 1s;background-image:radial-gradient(1.6px 1.6px at 18% 28%,#fff,transparent),radial-gradient(1px 1px at 60% 18%,#fff,transparent),radial-gradient(1.6px 1.6px at 82% 40%,#fff,transparent),radial-gradient(1px 1px at 36% 12%,#fff,transparent),radial-gradient(1px 1px at 92% 10%,#fff,transparent),radial-gradient(1.3px 1.3px at 50% 34%,#fff,transparent)}
.city{position:absolute;bottom:0;left:0;width:100%;height:68%;color:#8fa7d1;transition:color 1s}
.city .lt{fill:#ffe08a;opacity:0;transition:opacity 1s}
.mull{position:absolute;inset:0;background:linear-gradient(90deg,transparent calc(50% - 3px),#cfd6e6 calc(50% - 3px),#cfd6e6 calc(50% + 3px),transparent calc(50% + 3px))}
.t-morning .sky{background:linear-gradient(#78bcff,#ffd9ad)}
.t-day .sky{background:linear-gradient(#3d8bff,#a9d9ff)}
.t-evening .sky{background:linear-gradient(#ff7e5f,#feb47b 45%,#7b4fa8)}
.t-evening .sun{top:66%;background:radial-gradient(#ffd0a0,#ff7e3f);box-shadow:0 0 40px #ff7e3f}
.t-evening .city{color:#57467a}.t-evening .city .lt{opacity:.5}
.t-night .sky{background:linear-gradient(#060a22,#1b2160)}
.t-night .sun{opacity:0;top:90%}.t-night .stars{opacity:1}.t-night .city{color:#0b0f2b}.t-night .city .lt{opacity:.95}
.t-night .wall{background:linear-gradient(180deg,#2c3150,#22263e 60%)}
.t-night .floor{filter:brightness(.5)}
.floor{position:absolute;left:0;right:0;bottom:0;height:40%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 2px,transparent 2px 70px),linear-gradient(180deg,#c9cfdc,#a6afc3);transition:filter 1s}
.poster{position:absolute;top:22px;left:3%;width:15%;min-width:66px;height:34%;border-radius:12px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;box-shadow:0 6px 14px rgba(0,0,0,.25);text-align:center;padding:4px}
.poster b{font-size:10px;line-height:1.2;margin-top:2px}
.clockbox{position:absolute;top:18px;right:3%;background:linear-gradient(160deg,#1b2238,#0d1226);color:#7dffb0;border-radius:14px;padding:6px 12px;text-align:center;box-shadow:0 6px 14px rgba(0,0,0,.35);z-index:3;border:1px solid #2e3a5e}
.clk{font-family:'Black Han Sans';font-size:26px;letter-spacing:2px;text-shadow:0 0 12px #39ff88;line-height:1.2}
.cdate{font-size:11px;color:#9fb0d0}
.desk-co{position:absolute;bottom:37%;width:12%;min-width:58px;text-align:center;z-index:2;transition:opacity .8s}
.person{display:inline-block;font-size:30px;line-height:1;position:relative;z-index:1;transition:opacity .6s}
.desk-co .person{margin-bottom:-6px}
.dk{height:20px;border-radius:6px 6px 2px 2px;background:linear-gradient(#ad8259,#7d5a3c);position:relative;z-index:2;box-shadow:0 3px 0 #5e432c}
.dk:before{content:'';position:absolute;right:8%;width:34%;height:17px;top:-15px;background:linear-gradient(#2b3350,#1b2238);border-radius:3px;box-shadow:0 0 8px rgba(120,180,255,.55)}
.tag{display:block;font-size:10px;background:#1b2238;color:#ffd66b;border-radius:6px;padding:0 6px;width:max-content;margin:0 auto 2px}
.ot-away .desk-co .person{opacity:0}
.me{position:absolute;bottom:14%;transform:translateX(-50%);transition:left 1s cubic-bezier(.5,0,.3,1),opacity .6s;z-index:6;text-align:center}
.me .person{font-size:54px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.28));animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.bubble{position:absolute;bottom:100%;left:50%;transform:translateX(-50%) scale(.6);opacity:0;white-space:nowrap;background:#fff;color:#1b2238;border-radius:14px;padding:5px 12px;font-family:'Gowun Dodum';font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:.25s;margin-bottom:6px}
.bubble.on{opacity:1;transform:translateX(-50%) scale(1)}
.bubble:after{content:'';position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:#fff}
.mydesk{position:absolute;bottom:2%;left:44%;transform:translateX(-50%);width:30%;min-width:150px;height:46px;border-radius:10px 10px 4px 4px;background:linear-gradient(#c0915f,#8a6342);z-index:7;box-shadow:0 5px 0 #64462e}
.mydesk .mon{position:absolute;left:60%;top:-40px;width:60px;height:40px;background:#1b2238;border-radius:6px;padding:3px}
.scr{height:100%;border-radius:3px;background:linear-gradient(135deg,#3a7bfd,#7f5bff,#3ad1ff);background-size:200% 200%;box-shadow:0 0 16px rgba(110,140,255,.85);animation:scr 3s infinite alternate}
@keyframes scr{to{background-position:100% 100%}}
.mydesk .cup{position:absolute;left:14%;top:-18px;font-size:18px}
.pantry{position:absolute;left:2%;bottom:37%;font-size:26px;text-align:center;z-index:2;line-height:1}
.pantry small,.door small{display:block;font-size:10px;color:#475069}
.door{position:absolute;right:1%;bottom:36%;font-size:36px;z-index:2;text-align:center;line-height:1}
.plant{position:absolute;left:15%;bottom:4%;font-size:34px;z-index:7}
.nightshade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 44% 78%,rgba(255,220,150,.08) 12%,rgba(5,8,30,.55) 55%);opacity:0;transition:opacity 1s;z-index:5}
.t-night .nightshade{opacity:1}
.beachlayer{position:absolute;inset:0;opacity:0;transition:opacity .8s;background:linear-gradient(#4fc3ff,#c4ecff 52%,#38bdf8 52%,#7dd3fc 64%,#fde4a8 64%,#f6c87a);z-index:8;pointer-events:none}
.beachlayer span{position:absolute;font-size:44px}
.beach .beachlayer{opacity:1}
.beach .me{z-index:9}
#fx{position:absolute;inset:0;pointer-events:none;z-index:10}
.pt{position:absolute;font-weight:800;font-size:13px;padding:3px 10px;border-radius:999px;animation:up 1.7s ease-out forwards;color:#fff;white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.pt.up{background:var(--g-green)}.pt.down{background:var(--g-red)}
@keyframes up{0%{transform:translateY(10px) scale(.6);opacity:0}15%{opacity:1;transform:translateY(0) scale(1)}100%{transform:translateY(-80px);opacity:0}}
/* CARDS */
.card{background:linear-gradient(180deg,#ffffff,#f6f7fd);border-radius:22px;padding:22px;box-shadow:0 12px 34px rgba(5,10,40,.3);margin-bottom:14px;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card h2{font-family:'Black Han Sans';font-size:25px;color:#2f2b7e;line-height:1.3;text-shadow:0 2px 0 rgba(124,108,255,.15)}
.card h3{font-family:'Black Han Sans';font-size:18px;color:#2a3150}
.k{font-size:12.5px;color:var(--sub)}
.npc{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.npc-ava{font-size:40px;width:72px;height:72px;border-radius:24px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,#e0e7ff,#fce7f3);box-shadow:inset 0 0 0 2px #fff,0 6px 14px rgba(91,140,255,.25)}
.npc-name{font-size:13px;color:var(--sub);font-weight:700}
.txt{font-family:'Gowun Dodum';font-size:16.5px;background:linear-gradient(135deg,#f3f6ff,#faf5ff);border:1px solid #e3e8fb;padding:14px 16px;border-radius:14px;margin:8px 0 4px;line-height:1.75}
.choices button,.btn{display:block;width:100%;text-align:left;padding:13px 16px;margin-top:10px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font-size:15px;cursor:pointer;color:var(--ink);font-family:inherit;transition:.18s;box-shadow:0 2px 0 #e7eaf3}
.choices button:hover,.btn:hover{border-color:#8a9cff;background:#f3f5ff;transform:translateY(-1px)}
.btn.main{background:var(--g-main);color:#fff;border:none;text-align:center;font-family:'Black Han Sans';font-size:18px;letter-spacing:.5px;box-shadow:0 8px 20px rgba(91,110,255,.4)}
.btn.main:hover{filter:brightness(1.08);background:var(--g-main)}
.btn.gold{background:var(--g-gold);color:#4a2a00;border:none;text-align:center;font-family:'Black Han Sans';font-size:18px}
.btn.ghost{text-align:center;color:var(--sub)}
.btn.sm{display:inline-block;width:auto;padding:6px 12px;font-size:13px;margin:0}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
@media(max-width:640px){.actions{grid-template-columns:repeat(2,1fr)}}
.act{border:1.5px solid var(--line);border-radius:18px;background:#fff;padding:12px;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);transition:.18s;display:flex;gap:10px;align-items:flex-start;box-shadow:0 3px 0 #e7eaf3}
.act:hover{border-color:#8a9cff;transform:translateY(-2px);box-shadow:0 8px 18px rgba(91,110,255,.18)}
.act .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none;background:var(--g-main);box-shadow:0 4px 10px rgba(91,110,255,.3)}
.act .t{font-weight:900;font-size:14.5px}
.act .d{font-size:11.5px;color:var(--sub);line-height:1.35;margin-top:2px}
.act.dis,.busy .act{opacity:.4;pointer-events:none}
.act.danger .ic{background:var(--g-red)}
.act.special .ic{background:var(--g-gold)}
.act.green .ic{background:var(--g-green)}
.act.warm .ic{background:var(--g-warm)}
.aphead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ap{display:flex;gap:5px}
.ap i{width:14px;height:14px;border-radius:50%;background:#e2e6f1;display:block}
.ap i.on{background:var(--g-main);box-shadow:0 0 8px rgba(91,110,255,.6)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:13px;padding:4px 11px;border-radius:999px;font-weight:700;color:#fff}
.chip.up{background:var(--g-green)}.chip.down{background:var(--g-red)}
.warn{background:linear-gradient(135deg,#fff1f1,#fff7ed);border:1px solid #fbc7c7;color:#b42318;border-radius:12px;padding:8px 12px;font-size:13.5px;margin-top:8px}
.info{background:linear-gradient(135deg,#eef3ff,#f5f0ff);border:1px solid #d6dcff;color:#2c3f8f;border-radius:12px;padding:8px 12px;font-size:13.5px;margin-top:8px}
.good{background:linear-gradient(135deg,#ecfdf5,#eff6ff);border:1px solid #b7ebd0;color:#11643f;border-radius:12px;padding:8px 12px;font-size:13.5px;margin-top:8px}
.tip{font-size:13px;color:var(--sub);font-family:'Gowun Dodum'}
.progress{height:10px;border-radius:6px;background:#e9ecf5;overflow:hidden;margin-top:4px}
.progress div{height:100%;border-radius:6px;background:var(--g-main)}
.speed{display:flex;gap:6px;align-items:center;margin-left:auto}
.speed button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.speed button.on{background:var(--g-main);color:#fff;border-color:transparent}
details.log{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:10px 16px;color:#dfe5ff;font-size:12.5px}
details.log summary{cursor:pointer;font-weight:700;color:#fff}
details.log div{padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.15)}
/* title */
.hero{text-align:center;padding:26px 8px 6px}
.hero .big{font-size:58px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.25))}
.hero h1{font-family:'Black Han Sans';font-size:52px;line-height:1.1;margin-top:8px;background:linear-gradient(135deg,#5b8cff,#a855f7,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--sub);margin:8px 0 0;font-family:'Gowun Dodum';font-size:16px}
.inp{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit;margin-top:6px;background:#fff}
.specs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
@media(max-width:520px){.specs{grid-template-columns:1fr}}
.spec{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;background:#fff;font-family:inherit;text-align:left;font-size:14.5px;color:var(--ink);transition:.15s}
.spec.on{border-color:transparent;background:linear-gradient(135deg,#e7edff,#f3e8ff);box-shadow:inset 0 0 0 2px #7c8cff;font-weight:700}
.spec small{display:block;color:var(--sub);font-weight:400;font-size:12px}
.comp{display:flex;gap:14px;align-items:flex-start;border:1.5px solid var(--line);border-radius:18px;padding:14px;margin-top:10px;cursor:pointer;background:#fff;font-family:inherit;text-align:left;width:100%;color:var(--ink);transition:.18s}
.comp:hover{border-color:#8a9cff;transform:translateY(-2px);box-shadow:0 8px 18px rgba(91,110,255,.18)}
.comp .ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:30px;flex:none;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.comp .cn{font-weight:900;font-size:16px}
.comp .tg{font-size:11.5px;background:#eef1f6;border-radius:6px;padding:1px 7px;margin-left:6px;color:var(--sub);font-weight:700}
.comp .sal{font-family:'Black Han Sans';color:#4f46e5;font-size:15px}
.comp .ds{font-size:13px;color:var(--sub)}
.stars5{color:#f59e0b;letter-spacing:1px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:7px 10px;border-bottom:1px solid #eef0f6;text-align:left}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.slip{border-radius:16px;overflow:hidden;margin-top:12px;box-shadow:0 4px 14px rgba(20,30,80,.1);border:1px solid #e3e7f3;background:#fff}
.slip h3{background:linear-gradient(135deg,#1f2a5a,#3b3f8f);color:#fff;font-size:15px;padding:9px 14px}
.slip.red h3{background:linear-gradient(135deg,#b4233a,#e2563f)}
.slip .sec td{background:#f4f6fb;font-weight:700;font-size:12.5px;color:var(--sub)}
.slip .tot td{font-weight:900;font-size:15px;background:linear-gradient(90deg,#fff9e6,#fff3d6)}
.minus{color:#e5484d}.plus{color:#16a34a}
.sms{background:linear-gradient(135deg,#1b2238,#2d2f6b);color:#fff;border-radius:16px;padding:12px 16px;font-size:15px;margin-top:8px;animation:slide .6s ease;box-shadow:0 8px 20px rgba(20,20,60,.3)}
.sms .from{font-size:12px;color:#a9b6e8}
.sms b{font-family:'Black Han Sans';font-weight:400;font-size:22px;color:#7dffb0}
@keyframes slide{from{transform:translateY(-24px);opacity:0}to{transform:none;opacity:1}}
.bal{font-family:'Black Han Sans';font-size:30px;text-align:center;margin-top:14px}
.grade{font-family:'Black Han Sans';font-size:110px;text-align:center;line-height:1;margin:6px 0;filter:drop-shadow(0 8px 14px rgba(0,0,0,.15))}
.g-S{background:linear-gradient(135deg,#a855f7,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.g-A{background:linear-gradient(135deg,#3b82f6,#6366f1);-webkit-background-clip:text;background-clip:text;color:transparent}
.g-B{background:linear-gradient(135deg,#22c55e,#14b8a6);-webkit-background-clip:text;background-clip:text;color:transparent}
.g-C{background:linear-gradient(135deg,#f59e0b,#f97316);-webkit-background-clip:text;background-clip:text;color:transparent}
.g-D{background:linear-gradient(135deg,#ef4444,#b91c1c);-webkit-background-clip:text;background-clip:text;color:transparent}
.evrow{display:grid;grid-template-columns:150px 1fr 46px;gap:10px;align-items:center;margin-top:8px;font-size:14px}
.evrow .progress{margin:0}
.evrow b{text-align:right;font-family:'Black Han Sans';font-weight:400;font-size:16px}
.end-ic{font-size:86px;text-align:center;filter:drop-shadow(0 10px 18px rgba(0,0,0,.2))}
.end-t{text-align:center;font-family:'Black Han Sans';font-size:34px;background:var(--g-main);-webkit-background-clip:text;background-clip:text;color:transparent}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}

 const tk=TK,dur=SPEED===2?1300:2800,startM=9*60;Snd.action(a.id,dur/1000);

 const lines=a.lines||[];let li=-1;const t0=performance.now();

  scene.className='scene t-'+(a.beach?'day':tclass(m))+(a.beach&&k>.1?' beach':'')+(a.away&&m>19*60?' ot-away':'');

function titleScreen(){const sv=loadSave();S=S||newState();
 screen(()=>`<section class="card"><div class="hero"><div class="big">🏢💼🚇</div><h1>오늘도 출근</h1><p>26살 신입사원부터 60살 정년, 혹은 사장실까지.<br>야근·회식·억까·정치질·인사평가·승진시험을 버티는 회사생활 시뮬레이터</p></div>
 ${sv?`<button class="btn gold" style="margin-top:18px" onclick="${b(()=>{S=sv;resumeGame();})}">▶ 이어하기 — ${sv.name} ${sv.everHired?RANKS[sv.rank]:'취준생'} · ${sv.age}세 · ${sv.cal}년 ${sv.month}월</button>`:''}
 <button class="btn main" style="margin-top:10px" onclick="${b(()=>{S=newState();drawStart();})}">🆕 새 인생 시작하기</button>
 <div class="info" style="margin-top:14px">💡 <b>한 달에 행동 3번</b>을 고르면 사무실에서 시간이 흘러가. 월말엔 돌발 이벤트와 월급날, 12월엔 인사평가와 연봉협상이 있고, 1월엔 승진시험이 열려. 매달 자동 저장돼.<br>🎧 오른쪽 아래 🔊 버튼에서 배경음악·효과음·볼륨을 조절할 수 있어.</div>
 ${collectionHtml()}</section>`);}
function resumeGame(){if(!S.employed)return jobBoard();monthIntro();}
function drawStart(){const el=$id('nm');if(el&&el.value!==undefined)S.name=el.value||'김신입';
 screen(()=>`<section class="card"><h2>🧑‍🎓 캐릭터 만들기</h2>
 <div style="margin-top:12px"><b>이름</b><input id="nm" class="inp" maxlength="6" value="${S.name}" placeholder="김신입"></div>
 <div style="margin-top:16px"><b>내 스펙 고르기</b> <span class="k">(3개까지 · ${S.picked.length}/3)</span><div class="specs">
 ${SPECS.map(sp=>`<button class="spec ${S.picked.includes(sp.id)?'on':''}" onclick="${b(()=>{const i=S.picked.indexOf(sp.id);if(i>=0)S.picked.splice(i,1);else if(S.picked.length<3)S.picked.push(sp.id);drawStart();})}">${sp.t}<small>${sp.d}</small></button>`).join('')}
 </div></div>
 <button class="btn main" style="margin-top:18px" onclick="${b(beginSearch)}">취업 전선에 뛰어들기 ▶</button>
 <button class="btn ghost" onclick="${b(titleScreen)}">← 처음으로</button></section>`);}
function beginSearch(){const el=$id('nm');S.name=((el&&el.value)||S.name||'김신입').trim()||'김신입';
 S.spec=20;S.picked.forEach(id=>{const sp=SPECS.find(x=>x.id===id);S.spec+=sp.v;if(sp.skill)S.skill+=sp.skill;if(sp.peers)S.peers+=sp.peers;if(sp.conn)S.conn=true;});
 log(`취준 시작 (스펙 ${S.spec})`);jobBoard();}

/* ===================== 구직 (신입 / 경력) ===================== */
function careerOffer(c){if(!S.everHired)return c.sal;const base=c.sal*(1+Math.min(S.rank,4)*.22);const cur=S.salary*(c.sal/4300)*(.95+Math.random()*.2);return Math.round(Math.max(base,cur)/10)*10;}
function jobBoard(){if(!S.offers||!S.offers._m||S.offers._m!==S.cal*12+S.month){S.offers={_m:S.cal*12+S.month};COMPANIES.forEach(c=>S.offers[c.id]=careerOffer(c));}
 const career=S.everHired;
 screen(()=>hud()+`<section class="card"><h2>📋 ${career?'경력직 채용 공고':'신입 공채 공고'}</h2>
 <p class="k">${career?`지금 직급(${RANKS[S.rank]})을 유지하고 지원해. 떨어지면 한 달이 지나가.${S.ui>0?` 실업급여 ${S.ui}개월 남음.`:''}${S.stigma?' <b class="minus">⚠️ 징계 이력 때문에 서류 통과가 어려워.</b>':''}`:'서류 → 면접 순으로 진행돼. 떨어지면 한 달이 지나고 생활비 80만 원이 나가.'}</p>
 ${COMPANIES.map(c=>`<button class="comp" onclick="${b(()=>applyTo(c))}"><div class="ic" style="background:${c.grad}">${c.icon}</div><div><div class="cn">${c.name}<span class="tg">${c.type}</span></div>
 <div class="sal">${career?'제시 연봉':'초봉'} ${man(S.offers[c.id])} · 난이도 <span class="stars5">${'★'.repeat(c.star)}${'☆'.repeat(5-c.star)}</span></div><div class="ds">${c.desc}</div></div></button>`).join('')}
 ${career?`<div class="row" style="margin-top:6px"><button class="btn" onclick="${b(()=>restMonth())}">🛋️ 한 달 쉬면서 재충전</button><button class="btn" onclick="${b(()=>ending(S.age>=50?'retire':'quit_life'))}">🏁 회사원 졸업 (게임 종료)</button></div>`:''}
 </section>`+logBox());}
function applyTo(c){S.stats.apps++;let p;
 if(!S.everHired){p=clamp(.65+(S.spec-c.diff)/100,.05,.97);if(S.conn&&c.id==='mid')p=1;}
 else p=clamp(.5+S.skill/220+Math.min(S.rank,4)*.04-c.diff/250-(S.stigma?.3:0)-(S.age>=50?.15:0)-(S.rank>=4&&c.startup?.1:0),.05,.95);
 if(!P(p))return failSearch(c,'📭 서류 탈락',pick(['"귀하의 우수한 역량에도 불구하고 한정된 인원으로 인해…" 자동 발송 메일이 왔다.','(연락 없음. 그냥 없음. 이것이 무소식 탈락이다.)','"아쉽게도 이번에는 함께하지 못하게 되었습니다." 이번에도, 저번에도.']));
 const qs=S.everHired?shuffle(CAREER_QS).slice(0,2).concat(shuffle(QS).slice(0,1)):shuffle(QS).slice(0,3);
 interview(c,0,0,qs);}
function interview(c,i,score,qs){if(i>=qs.length)return interviewEnd(c,score);const q=qs[i];
 screen(()=>hud()+sceneCard(q.who,`${c.icon} ${c.name} 면접관 · 질문 ${i+1}/${qs.length}`,'🎤 면접 중',q.q,
 q.ch.map(o=>`<button onclick="${b(()=>{const s=typeof o.s==='function'?o.s():o.s;if(o.m)apply({mental:o.m});interview(c,i+1,score+s,qs);})}">${o.t}</button>`).join('')));}
function interviewEnd(c,score){const total=score+(S.everHired?(S.skill-50)/20:(S.spec-50)/20);
 if(total<c.th)return failSearch(c,'😞 면접 탈락',pick(['"좋은 인재지만 저희와 방향이 조금 다른 것 같습니다."','면접 끝나고 엘리베이터에서 면접관이 하품하는 걸 봤다. 불길했는데 역시나.','"아쉽게도…" 문자가 왔다. 면접비 2만 원은 들어왔다.']));
 if((c.id==='big'||c.id==='pub')&&P(.12))return failSearch(c,'🙄 억까: 내정자 존재','면접 분위기 최고였다. 면접관이 웃기까지 했다. 그런데 불합격. 이미 "내정자"가 있었다고 한다. 들러리였다.');
 offer(c);}
function livingCost(){return expenses().reduce((a,x)=>a+x[1],0);}
function failSearch(c,title,msg){const ch=apply({mental:-R(5,8)});log(`${c.name} 불합격`);
 if(!S.everHired){S.searchMonths++;S.money-=800000;ch.push(['money',-800000]);let extra='\n\n한 달이 지났다. 생활비로 80만 원이 나갔다.';
  if(S.money<0&&!S.mom){S.mom=true;S.money+=3000000;ch.push(['money',3000000]);extra+='\n\n📞 엄마: "밥은 잘 먹고 다니니? 300만 원 보냈다. 기죽지 마." …눈물이 났다.';}
  else if(S.money<0||S.mental<=0)return ending('nojob');
  const r=advanceCal();if(r)return ending(r);
  return showResult(title,msg+extra,ch,jobBoard,'다른 공고 보기 ▶');}
 return unempMonth(title,msg,ch);}
function unempMonth(title,msg,ch=[]){const cost=livingCost();S.money-=cost;ch.push(['money',-cost]);let extra=`\n\n한 달이 지났다. 생활비 ${won(cost)}.`;
 if(S.ui>0){S.ui--;S.money+=1900000;ch.push(['money',1900000]);extra+=` 실업급여 1,900,000원 입금 (남은 ${S.ui}개월).`;}
 S.unempMonths++;const r=advanceCal();if(r)return ending(r);
 if(S.unempMonths>=12)return ending('longjob');if(S.money<=-50000000)return ending('bankrupt');
 showResult(title,msg+extra,ch,jobBoard,'다른 공고 보기 ▶');}
function restMonth(){const ch=apply({mental:R(12,18),hp:R(10,15)});unempMonth('🛋️ 한 달 재충전','늦잠 자고, 운동하고, 밀린 드라마를 봤다. 마음이 좀 회복됐다.',ch);}
function offer(c){const sal=S.everHired?S.offers[c.id]:c.sal+(S.spec>=65&&!c.black?200:0);
 screen(()=>hud()+`<section class="card"><div class="bigicon">🎉</div><h2>최종 합격!</h2><p>${c.icon} <b>${c.name}</b>에서 합격 연락이 왔다! 근로계약서를 확인하자.</p>
 <div class="contract"><h3 class="disp">근로계약서</h3><table>
 <tr><td>회사</td><td>${c.name} (${c.type})</td></tr><tr><td>직급</td><td>${RANKS[S.rank]}${S.everHired?' (경력직)':''}</td></tr><tr><td>연봉</td><td><b>${man(sal)}</b> (세전)</td></tr>
 <tr><td>근무시간</td><td>${c.black?'09:00 ~ 18:00 (단, 업무 상황에 따라 탄력적으로 운영)':c.startup?'자율 출퇴근 (근데 다들 밤 10시에 퇴근함)':'09:00 ~ 18:00'}</td></tr>
 <tr><td>연장근로</td><td>${c.otPay?'연장근로수당 별도 지급':'<b class="minus">포괄임금제 (연봉에 포함)</b>'}</td></tr>
 <tr><td>수습</td><td>${c.black?'<b class="minus">3개월, 급여 80%</b>':'3개월, 급여 100%'}</td></tr>
 <tr><td>승진</td><td>${c.black?'사장님 재량':c.safe?'승진시험 필수 (호봉제)':'평가 포인트 + 승진시험/심사'}</td></tr></table></div>
 <button class="btn main" onclick="${b(()=>hire(c,sal))}">✍️ 서명한다</button>
 <button class="btn ghost" onclick="${b(()=>{log(`${c.name} 합격했지만 거절`);jobBoard();})}">거절하고 다른 회사 알아보기</button></section>`);}
function hire(c,sal){const first=!S.everHired;S.cid=c.id;S.salary=sal;if(first)S.firstSal=sal;S.employed=true;S.everHired=true;S.companyMonths=0;S.probation=c.black?3:0;
 S.boss=50;S.peers=Math.max(40,S.peers);S.strikes.boss=0;S.line=null;S.flags.goodBoss=false;S.flags.lineYear=undefined;S.unempMonths=0;S.ui=0;S.jobHunt=0;S.leave=15;
 S.career.push({c:c.name,icon:c.icon,from:`${S.cal}.${S.month}`,rank:RANKS[S.rank]});
 log(`${c.icon} ${c.name} 입사! 연봉 ${man(sal)}`);S.mental=clamp(S.mental+15,0,100);
 const r=advanceCal();if(r)return ending(r);setKpi();
 if(first)firstDay(0);else runEvent(CAREER_FIRST,()=>monthStart(),true);}
const CAREER_FIRST={who:'🧑‍💼',name:'새 팀장',title:'경력직 첫 출근',text:()=>`"${S.name} ${RANKS[S.rank]}님, 경력직이시니까 바로 실전 투입이죠? 이번 주에 프로젝트 하나 맡아주세요."\n자리엔 전임자가 남긴 컵라면 용기가 있다.`,ch:[
 {t:'"네, 바로 파악하겠습니다!"',fx:{boss:4,hp:-4,perf:3},r:'첫 주부터 야근이다. 그래도 팀장 눈빛이 좋다.'},
 {t:'"인수인계 문서부터 받아볼 수 있을까요?"',fx:{skill:2,mental:2},r:'"인수인계요? 전임자가 다 머릿속에…" 그런 건 없었다.'}]};
const FIRST=[
 {who:'👨‍💼',name:'김부장',title:'첫 출근: 자기소개',text:()=>`"자자, 다들 주목! 오늘부터 같이 일할 ${S.name} 씨야. 자기소개 한번 해봐."\n15쌍의 눈이 나를 본다.`,ch:[
  {t:'"열심히 배우겠습니다! 잘 부탁드립니다!" (무난)',fx:{boss:2,peers:2},r:'박수가 나왔다. 무난함이 최고다.'},
  {t:'"제 MBTI는요, 취미는요…" (TMI 개그)',fn:()=>P(.5)?{r:'빵 터졌다! 분위기 메이커 등극.',fx:{peers:7,boss:2}}:{r:'…정적. 누가 "아~" 했다. 부장이 "자, 그럼 일하자" 했다.',fx:{mental:-6}}},
  {t:'"이 회사에 뼈를 묻겠습니다!"',fx:{boss:5,peers:-2},r:'부장 눈이 반짝였다. "요즘 보기 드문 친구네!" 동료들 표정은 "저 사람 오래 못 가겠다"였다.'}]},
 {who:'🖨️',name:'자리 배정',title:'내 자리는 어디?',text:'"자리는 저기, 복합기 옆이야." 복합기가 하루 종일 위잉 위잉 돌아간다. 모니터는 2015년산이다.',ch:[
  {t:'"네, 감사합니다!"',fx:{mental:-2},r:'모니터를 닦고 포스트잇을 붙였다. 여기가 이제 내 자리다.'},
  {t:'"혹시 모니터 하나 더 받을 수 있을까요?"',fn:()=>P(.4)?{r:'총무팀이 남는 모니터를 줬다! 듀얼 모니터 획득.',fx:{skill:2,mental:3}}:{r:'"신입이 벌써 장비 욕심이야?" 부장 귀에 들어갔다.',fx:{boss:-3}}}]},
 {who:'🧑‍💼',name:'사수 이대리',title:'첫 업무',text:'"이 엑셀에서 VLOOKUP으로 거래처별 매출 좀 뽑아줘. 할 줄 알지?"',ch:[
  {t:'"네, 할 줄 압니다!"',fn:()=>S.skill>=35?{r:'10분 만에 끝냈다. 사수: "오, 쓸만한데?"',fx:{peers:4,perf:3}}:{r:'사실 몰랐다. 3시간 동안 #N/A와 싸웠다. 사수가 조용히 와서 고쳐줬다.',fx:{mental:-5,skill:2}}},
  {t:'"솔직히 잘 모릅니다. 알려주실 수 있나요?"',fx:{skill:4,peers:3},r:'"솔직해서 좋네." 사수가 30분 동안 엑셀 꿀팁을 전수해 줬다.'},
  {t:'안다고 해놓고 밤새 유튜브로 배운다',fx:{skill:5,hp:-6,perf:2},r:'새벽 2시, 드디어 VLOOKUP 정복. 사수는 내가 원래 잘하는 줄 안다.'}]},
 {who:'🍲',name:'신입 환영 점심',title:'라떼는 말이야',text:'"내가 신입 때는 말이야, 아침 7시에 와서 부장님 책상 닦고…" 부장의 신입 시절 이야기가 40분째다. 국밥이 다 식었다.',ch:[
  {t:'"와, 정말 대단하세요!" 리액션 장인 모드',fx:{boss:5,mental:-4},r:'부장이 기분 좋게 계산했다. "자네 마음에 들어."'},
  {t:'묵묵히 국밥을 먹는다',fx:{mental:-1},r:'국밥은 식어도 맛있다.'}]},
];
function firstDay(i){if(i>=FIRST.length){log('첫 출근 생존 완료');return monthStart();}runEvent(FIRST[i],()=>firstDay(i+1),true);}

/* ===================== 시간 흐름 ===================== */
function advanceCal(){S.month++;if(S.month>12){S.month=1;S.cal++;S.age++;
  if(S.life.house){const g=R(-6,10);S.life.houseVal=Math.round(S.life.houseVal*(1+g/100));S.notices.push(`🏠 집값 ${g>=0?'+':''}${g}% → ${eok(S.life.houseVal)}`);}}
 if(S.employed){S.careerMonths++;S.companyMonths++;}
 if(S.month===1){if(S.age>=(isExec()?66:60))return 'retire';}
 return null;}
function setKpi(){const left=13-S.month;S.kpiTarget=Math.round(11*(1+Math.min(S.rank,4)*.08)*left);S.perf=0;}
function monthStart(){S.ap=3;const c=C();
 if(isExec()){const d=R(-5,1);S.rate=clamp(S.rate+d,0,250);if(d<=-3)S.notices.push(`📉 시장 상황 악화: 실적 달성률 ${d}%p`);}
 if(S.month===2||S.month===9){const nm=S.month===2?'설':'추석';if(c.black)S.notices.push(`🎁 ${nm} 선물: 스팸 세트 1개 (상여금은 없다)`);else{const amt=Math.round(S.salary*10000/12*.5*(c.bonus>=1?1:.6)/1000)*1000;S.money+=amt;S.stats.earned+=amt;S.notices.push(`🎁 ${nm} 명절 상여금 ${won(amt)} 입금!`);}}
 if(S.month===6&&!isExec())S.notices.push(`📊 상반기 중간점검: 성과 ${S.perf} / 목표 ${S.kpiTarget} (${Math.round(S.perf/Math.max(1,S.kpiTarget)*100)}%)`);
 if(S.month===1)return january(()=>{save();monthIntro();});
 save();monthIntro();}
function january(next){const c=C();
 S.leave=Math.min(25,15+Math.floor(S.companyMonths/24));
 if(S.cal%2===0){S.strikes.hp=Math.max(0,S.strikes.hp-1);S.strikes.mental=Math.max(0,S.strikes.mental-1);}
 if(isExec())S.rate=100;
 if(!isExec()&&S.age>=56&&!c.black){S.salary=Math.round(S.salary*.9);S.notices.push('📉 임금피크제 적용: 연봉 10% 삭감 (만 56세)');}
 setKpi();S.notices.push(`🎯 올해 성과 목표(KPI): ${S.kpiTarget}점`);
 if(S.execCand){S.execCand=false;return execSelection(next);}
 if(S.promoCand){S.promoCand=false;return promoProcess(next);}
 next();}

/* ===================== 사무실 & 행동 ===================== */
function staffActions(){const c=C();return[

 if(P(.25))return{fx:{hp:10,mental:4,boss:-1},r:'제주도 갔다! …둘째 날 부장 전화. "그 파일 어디 있어?" 바닷가에서 노트북을 켰다. (억까)'};
 return{fx:{hp:R(12,16),mental:R(14,18),boss:-2},r:pick(['알람 없이 일어난 평일 아침. 세상이 이렇게 아름다웠나.','하루 종일 침대와 한 몸. 완벽한 휴가였다.','평일 낮 바닷가. 다들 일하는 시간에 나는 파도를 본다.'])};}
function actionPanel(){const acts=isExec()?execActions():staffActions();const warns=[];
 if(S.hp<25)warns.push('❤️ 체력이 위험해! 0이 되면 쓰러져서 병가 (경고 누적 3번이면 끝).');if(S.mental<25)warns.push('🧠 멘탈이 바닥이야. 0이 되면 번아웃 휴직!');if(S.boss<20)warns.push(isExec()?'🤵 회장 신임이 바닥… 경질 위기!':'👔 상사가 날 거슬려 해. 0이 되면 경고장!');if(S.money<0)warns.push(`💸 마이너스 통장 사용 중 (${won(S.money)}). -5천만 원이면 파산!`);
 if(S.unpaid>0)warns.push(`💢 밀린 월급 ${won(S.unpaid)}이 아직 안 들어왔다.`);
 const kp=Math.round(S.perf/Math.max(1,S.kpiTarget)*100);
 return `<section class="card"><div class="aphead"><h2>📅 ${S.month}월엔 뭐 하지?</h2><div class="ap">${[0,1,2].map(i=>`<i class="${i<S.ap?'on':''}"></i>`).join('')}</div><span class="k">남은 행동 ${S.ap}/3</span>
 <div class="speed">${[['🐢',1],['⚡',2],['⏭️',0]].map(([l,v])=>`<button class="${SPEED===v?'on':''}" onclick="${b(()=>{SPEED=v;store('osSpeed',String(v));officeScreen();})}">${l}</button>`).join('')}</div></div>
 <p class="tip">💬 ${pick(TIPS)}</p>
 ${isExec()?`<div class="k">📈 올해 실적 달성률 <b>${S.rate}%</b> (100% 이상 유지해야 재계약)</div><div class="progress"><div style="width:${Math.min(100,S.rate/1.5)}%;background:${S.rate>=100?'var(--g-green)':'var(--g-red)'}"></div></div>`
 :`<div class="k">🎯 올해 KPI 성과 ${S.perf} / ${S.kpiTarget} (${kp}%)</div><div class="progress"><div style="width:${Math.min(100,kp)}%"></div></div>`}
 ${S.notices.map(n=>`<div class="good">${n}</div>`).join('')}${warns.map(w=>`<div class="warn">${w}</div>`).join('')}
 <div class="actions">${acts.map(a=>`<button class="act ${a.cls||''} ${a.dis?'dis':''}" onclick="${b(()=>actionGo(a))}"><div class="ic">${a.ic}</div><div><div class="t">${a.t}</div><div class="d">${a.d}</div></div></button>`).join('')}</div>
 <div class="row" style="margin-top:12px"><button class="btn sm" onclick="${b(()=>{save();titleScreen();})}">💾 저장하고 타이틀로</button></div></section>`;}
function officeScreen(st,panelFn){screen(()=>hud()+sceneHtml(st||{bubble:pick(['이번 달도 버텨보자','월급날까지 D-30…','커피부터 마시자','오늘 회의 몇 개더라'])})+`<div id="panel">${panelFn?panelFn():actionPanel()}</div>`+logBox());}
function actionGo(a){if(a.dis)return;if(a.id==='quit')return quitConfirm();if(a.game)return typoGame(0,0);
 S.notices=[];const res=a.run();if(res.beachOff)a=Object.assign({},a,{beach:false,me:'😤'});
 const ch=apply(res.fx);S.ap--;log(`${a.ic} ${a.t}`);
 const card=()=>`<section class="card"><h2>${a.ic} ${a.t}</h2><div class="txt">${nl(res.r)}</div>${chipsHtml(ch)}<button class="btn main" onclick="${b(()=>guard(proceed))}">${S.ap>0?`확인 (남은 행동 ${S.ap}) ▶`:'월말 결산하러 가기 ▶'}</button></section>`;
 animate(a,ch,(st,live)=>{if(live&&$id('panel')){const h=$id('hud');if(h)h.outerHTML=hud();$id('panel').classList.remove('busy');$id('panel').innerHTML=card();}else officeScreen(st,card);});}
function proceed(){if(!S.employed)return;S.ap>0?officeScreen():monthEnd();}
function guard(next){if(S.money<=-50000000)return ending('bankrupt');
 if(S.hp<=0){S.strikes.hp++;if(S.strikes.hp>=3)return ending('hospital');S.hp=55;S.mental=clamp(S.mental-5,0,100);S.money-=600000;S.ap=0;log('🚑 과로로 쓰러짐');
  return strikeScreen('🚑','과로로 쓰러졌다','회의 도중 눈앞이 하얘졌다. 정신을 차리니 병원이었다. 의사가 한 달은 쉬라고 했다.\n병원비 60만 원, 이번 달 남은 행동 없음.','hp',next);}
 if(S.mental<=0){S.strikes.mental++;if(S.strikes.mental>=3)return ending('burnout');S.mental=50;S.ap=0;S.noPay=1;log('🫠 번아웃 휴직');
  return strikeScreen('🫠','번아웃 — 한 달 휴직','아침에 눈을 떴는데 몸이 움직이지 않았다. 회사에 휴직계를 냈다.\n이번 달은 무급 휴직이다.','mental',next);}
 if(S.boss<=0){if(isExec())return ending('exec_fired');S.strikes.boss++;log('📛 경고장');
  if(S.strikes.boss>=3)return unemploy('권고사직 (경고 3회 누적)',S.salary*10000/12*3,{ui:true});
  S.boss=25;return strikeScreen('📛','인사팀 경고장','"근무 태도 및 성과 불량으로 경고 처분합니다." 책상 위에 경고장이 놓였다.\n3번 쌓이면 권고사직이다.','boss',next);}
 next();}
function strikeScreen(ic,title,text,k,next){const n=S.strikes[k];screen(()=>hud()+`<section class="card"><div class="bigicon">${ic}</div><h2 style="text-align:center">${title}</h2><div class="txt">${nl(text)}</div>
 <div class="strikes">${[0,1,2].map(i=>`<i class="${i<n?'on':''}">${ic}</i>`).join('')}</div><p class="k" style="text-align:center">경고 ${n}/3 — 3번 쌓이면 ${k==='boss'?'권고사직':'게임 오버'}${k!=='boss'?' (2년마다 1개씩 회복)':''}</p>
 <button class="btn main" onclick="${b(next)}">다시 일어선다 ▶</button></section>`);}
function quitConfirm(){const nw=netWorth();const ex=isExec();
 screen(()=>hud()+sceneCard('📝',ex?'퇴임':'사직서',ex?'회사를 떠날 때인가?':'정말 그만둘 거야?',`현재 잔고 ${won(S.money)}, 순자산 ${eok(nw)}.\n어떤 퇴사를 할지 골라.`,
 (ex?'':`<button onclick="${b(()=>unemploy('자발적 퇴사',0,{}))}">🔄 퇴사하고 다른 회사 알아보기 (경력직 재취업)</button>`)+
 (nw>=1000000000?`<button onclick="${b(()=>ending('fire'))}">🏝️ 경제적 자유 달성! 조기 은퇴한다</button>`:'')+
 `<button onclick="${b(()=>ending(ex?'exec_retire':S.age>=55?'retire':'quit_life'))}">🏁 회사원 인생 졸업 (게임 종료)</button><button onclick="${b(()=>officeScreen())}">😮‍💨 …아니야. 참자</button>`));}

/* ===================== 미니게임: 오타 찾기 ===================== */
function typoGame(round,score){if(round>=5){const fx={perf:score*2,skill:1,hp:-3,mental:-(5-score)};if(score===5)fx.boss=3;const ch=apply(fx);S.ap--;S.notices=[];log(`🎯 집중 업무 ${score}/5`);
  const msg=score===5?'완벽하다! 오타 하나 없는 보고서. 부장이 "이번 건 손댈 데가 없네"라고 했다.':score>=3?'꽤 꼼꼼하게 검토했다. 보고서가 무사히 결재됐다.':'오타가 그대로 나갔다. "결재"를 "결제"로 쓴 보고서가 사장님까지 올라갔다…';
  return officeScreen({time:'evening',clock:'18:00',me:score>=3?'😎':'😵',bubble:score>=3?'검토 끝!':'망했다…'},()=>`<section class="card"><h2>🎯 집중 업무 결과: ${score}/5</h2><div class="txt">${msg}</div>${chipsHtml(ch)}<button class="btn main" onclick="${b(()=>guard(proceed))}">${S.ap>0?'확인 ▶':'월말 결산하러 가기 ▶'}</button></section>`);}
 const [right,wrong]=pick(TYPO);const odd=R(0,15);const tk=TK+1;const sec=SPEED===2?5:7;
 screen(()=>hud()+`<section class="card"><h2>🎯 보고서 오타 찾기 — ${round+1}/5</h2><p class="k">16개 단어 중 <b>틀린 단어 하나</b>를 ${sec}초 안에 찾아 클릭해! (현재 ${score}점)</p>
 <div class="timer"><div id="tm"></div></div><div class="grid4">${Array.from({length:16},(_,i)=>`<button class="tile" onclick="${b(()=>{Snd.sfx(i===odd?'correct':'wrong');typoGame(round+1,score+(i===odd?1:0));})}">${i===odd?wrong:right}</button>`).join('')}</div></section>`,
 ()=>{if(!CAN_ANIM)return;const tm=$id('tm');requestAnimationFrame(()=>{tm.style.transitionDuration=sec+'s';tm.style.width='0%';});setTimeout(()=>{if(TK===tk)typoGame(round+1,score);},sec*1000);});}

 {id:'gossip',w:4,cond:()=>S.flags.gossipRisk,who:'💬',name:'사내 메신저',title:'단톡방이 유출됐다',text:'동기 단톡방에서 "김부장 오늘 또 시작함ㅋㅋ"이라고 했던 캡처가… 김부장 손에 들어갔다고 한다.',after:()=>{S.flags.gossipRisk=false;},ch:[
  {t:'먼저 찾아가서 사과한다',fx:{boss:-6,mental:-8},r:'"그래, 젊을 때 그럴 수 있지." 웃고는 있는데 눈이 안 웃는다.'},
  {t:'끝까지 모른 척',fn:()=>P(.4)?{r:'다른 동기가 "제가 쓴 거예요" 하고 총대를 멨다. 고마운 놈… 커피 한 달 쏘기로 했다.',fx:{peers:5,mental:-3}}:{r:'부장이 회의 중에 "누구는 뒤에서 내 욕을 한다더라"며 나를 빤히 봤다.',fx:{boss:-14,mental:-8}}}]},
 {id:'blame',w:2.5,who:'😤',name:'박과장',title:'억까: 내 탓이라고?',text:'박과장이 거래처에 보낸 견적서 숫자가 0 하나 틀렸다. 근데 회의에서 "이거 ○○씨가 검토했잖아?"\n…난 본 적도 없다.',ch:[
  {t:'"검토한 적 없습니다" 메일 기록을 제시한다',fn:()=>S.flags.evidence?{r:'증거 폴더 출동. 메일 기록에 내 이름이 없다는 게 바로 증명됐다. 박과장이 헛기침을 했다.',fx:{boss:3,mental:5}}:(P(.5)?{r:'결재 라인에 내가 없다는 게 확인됐다. 박과장은 "아 착각했네~" 하고 끝.',fx:{mental:-2}}:{scold:1,sisal:{why:'거래처 견적서 금액 오류',intro:'"지금 과장님 탓하는 거야? 검토 라인에 있었으면 책임도 있는 거야. 시말서 써서 오늘 퇴근 전까지 내."\n…박과장이 뒤에서 웃고 있다.',fx:{boss:-6,mental:-6}}})},
  {t:'그냥 시말서 쓴다',fn:()=>({scold:1,sisal:{why:'거래처 견적서 금액 오류',intro:'"그래, 깔끔하게 시말서 한 장 쓰고 끝내자. 양식은 공유폴더에 있어."\n내가 뭘 잘못했는지부터 생각해 내야 한다.',fx:{mental:-5,perf:-3}}})}]},
 {id:'late',w:1.5,cool:6,who:'🚇',name:'출근길',title:'억까: 지하철이 멈췄다',text:'2호선이 신호 장애로 30분 동안 멈췄다. 9시 27분, 사무실 문을 열자 부장이 시계를 본다.\n"지금이 몇 시지?"',ch:[
  {t:'지하철 지연증명서를 뽑아서 낸다',fn:()=>P(.5)?{r:'"…그래, 지하철 문제면 어쩔 수 없지." 증명서가 나를 살렸다.',fx:{mental:-2}}:{scold:1,sisal:{why:'근무시간 지각 (09:27 출근)',intro:'"증명서? 그러니까 30분 더 일찍 나왔어야지. 나 때는 7시에 왔어. 시말서 써."',fx:{boss:-3,mental:-5}}}},
  {t:'"죄송합니다…" 고개를 숙인다',fn:()=>({scold:1,sisal:{why:'근무시간 지각 (09:27 출근)',intro:'"죄송하면 다야? 기강이 해이해졌어. 시말서 써서 가져와."',fx:{mental:-4}}})}]},
 {id:'wrongmail',w:1.2,cool:12,cond:()=>S.rank<=3,who:'📧',name:'Outlook',title:'메일 오발송 사고',text:'A사에 보내야 할 견적서를… B사에 보냈다. 그 안에는 A사 전용 할인 단가가 다 들어 있다. 전송 취소 시간은 이미 지났다.',ch:[
  {t:'바로 부장에게 보고하고 수습한다',fn:()=>P(.45)?{r:'B사 담당자에게 전화해 정중히 삭제를 부탁했다. 다행히 괜찮다고 했다. 부장: "빨리 보고해서 다행이야. 다음부턴 조심해."',fx:{boss:-2,mental:-5,skill:1}}:{scold:1,sisal:{why:'거래처 견적 메일 오발송',intro:'"이게 얼마나 큰 사고인지 알아? 단가가 다 털렸어! 경위 자세히 적어서 시말서 제출해."',fx:{boss:-5,mental:-6}}}},
  {t:'조용히 묻어둔다…',fn:()=>P(.35)?{r:'B사가 메일을 안 읽은 것 같다. 아무 일도 없었다. 심장은 일주일 내내 쿵쿵거렸다.',fx:{mental:-8}}:{scold:1,sisal:{why:'거래처 견적 메일 오발송 및 보고 누락',intro:'B사가 "A사엔 이 가격에 주셨던데요?"라며 전화를 걸어왔다. 부장 얼굴이 시뻘개졌다.\n"사고 친 것도 문제인데 보고를 안 해?! 시말서 써!"',fx:{boss:-10,mental:-8}}}}]},
 {id:'hoesikslip',w:1.2,cool:12,cond:()=>S.stats.drink>=1,who:'🍶',name:'회식 다음 날',title:'기억이 없다',text:'어제 회식 3차 이후 기억이 없다. 출근하니 동기가 속삭인다.\n"너 어제 부장님한테 \'부장님 그 넥타이 진짜 최악이에요\'라고 했어…"',ch:[
  {t:'먼저 부장을 찾아가 사과한다',fn:()=>P(.4)?{r:'"허허, 술자리에서 한 말인데 뭘. 근데 넥타이는 진짜 별로야?" 웃으며 넘어갔다.',fx:{boss:-2,mental:-4}}:{scold:1,sisal:{why:'회식 자리 품위 손상 발언',intro:'"사과는 됐고, 회사 생활엔 지켜야 할 선이 있어. 시말서로 정리해서 가져와."',fx:{boss:-4,mental:-5}}}},
  {t:'"기억이 안 납니다" 모르쇠',fn:()=>({scold:1,sisal:{why:'회식 자리 품위 손상 발언',intro:'"기억이 안 나? 15명이 다 들었는데? …시말서 써. 기억나는 데까지만."',fx:{boss:-8,mental:-5}}})}]},
 {id:'printer',w:2,who:'🖨️',name:'복합기',title:'억까: 복합기 고장',text:'내가 출력 버튼을 누르자 복합기가 "끼이익" 하고 멈췄다. 뒤에서 부장이 다가온다.\n"또 뭘 만졌어?"',ch:[
  {t:'직접 고쳐본다',fn:()=>P(.5+S.skill/200)?{r:'걸린 A4 한 장을 빼내자 복합기가 부활했다. 사무실에서 박수가 나왔다.',fx:{peers:5,mental:4}}:{r:'토너가 와르르. 셔츠가 검게 물들었다. 부장: "그러게 왜 만져."',fx:{mental:-7,money:-50000},scold:1}},
  {t:'"제가 안 그랬는데요…"',fx:{mental:-3,boss:-2},r:'아무도 안 믿는다. 오늘부로 복합기 담당이 됐다.'}]},
 {id:'hiking',w:1.5,who:'⛰️',name:'김부장',title:'주말 단합 등산',text:'"이번 토요일 아침 7시, 관악산 입구 집합! 단합 등산이야. 자율 참석이지만… 알지?"',ch:[
  {t:'간다. 정상에서 부장 사진 찍어주기',fx:{boss:7,hp:-8,mental:-6,peers:2},r:'정상에서 부장 독사진만 47장 찍었다. 하산 후 막걸리까지. 주말 끝.'},
  {t:'"부모님 댁에 가야 해서요…"',fx:{boss:-5,mental:5,hp:4},r:'월요일, 부장이 "부모님은 잘 계시고?" 하며 웃었다. 다 아는 눈치다.'}]},
 {id:'handover',w:1.5,who:'🧑‍💼',name:'옆자리 동료',title:'동료의 퇴사',text:'"나 다음 주까지만 나와. 이직했어. 미안한데 내 업무 네가 받게 될 것 같아…"\n인수인계 문서는 A4 반 장이다.',ch:[
  {t:'축하해주고 업무를 떠안는다',fx:{perf:4,hp:-6,mental:-8,peers:4},r:'두 사람 몫을 한다. 충원 계획은 "검토 중"이다. 1년째.'},
  {t:'이직 비결을 캐묻는다',fx:{jobHunt:1,mental:2,peers:2},r:'"헤드헌터 사이트에 이력서 올려둬. 나 연봉 20% 올렸어." 마음이 흔들린다.'}]},
 {id:'junior',w:2,cond:()=>S.rank>=1,who:'🧑‍🎓',name:'신입 최사원',title:'후배의 대형 사고',text:'신입이 "전체 회신"으로 팀장 욕을 보냈다. 원래는 동기한테 보내려던 거라고. 하얗게 질려서 나를 쳐다본다.',ch:[
  {t:'같이 부장한테 가서 수습해준다',fx:{peers:8,boss:-3,mental:-4},r:'"제가 교육을 잘못 시켰습니다." 같이 고개를 숙였다. 최사원은 나를 평생 은인으로 모시겠다고 했다.'},
  {t:'IT팀에 메일 회수를 요청한다',fn:()=>P(.4+S.skill/200)?{r:'메일이 열리기 전에 회수됐다! 최사원이 울었다.',fx:{peers:10,skill:2}}:{r:'회수 실패. 이미 18명이 읽음. 최사원은 다음 달 다른 팀으로 갔다.',fx:{peers:2,mental:-3}}},
  {t:'모른 척한다',fx:{peers:-6},r:'괜히 엮이면 나까지 다친다. …근데 좀 씁쓸하다.'}]},
 {id:'praise',w:1.5,cond:()=>S.skill>=50,who:'👩‍💼',name:'정이사',title:'의외의 칭찬',text:'엘리베이터에서 정이사를 만났다. "지난번 그 분석 자료, 자네가 만들었다면서? 잘했더구먼."',ch:[{t:'"감사합니다! 더 열심히 하겠습니다"',fx:{boss:6,mental:10,perf:3},r:'오늘 하루는 회사가 좀 다니고 싶은 곳 같았다.'}]},
 {id:'bonus',w:1,cool:10,cond:()=>!C().black,who:'💰',name:'인사팀 공지',title:'특별 성과급 지급!',text:'"올해 실적 호조에 따라 전 직원에게 특별 성과급을 지급합니다." 사무실에 환호성이!',ch:[{t:'통장 확인!',fn:()=>{const amt=Math.round(S.salary*10000*.06*C().bonus*(.6+Math.random()*.8)/10000)*10000;S.stats.bonus+=amt;S.stats.earned+=amt;return{r:`특별 성과급 ${won(amt)} 입금! 오늘 저녁은 치킨이다.`,fx:{money:amt,mental:12}};}}]},
 {id:'layoff',w:1,cool:36,cond:()=>S.companyMonths>=36&&!C().safe&&S.rank<=4,who:'📉',name:'인사팀',title:'억까: 희망퇴직 면담',text:'회사 실적이 나빠져 "희망퇴직"을 받는다고 한다. 인사팀이 나를 면담에 불렀다. 위로금은 연봉 1년 치.\n…왜 하필 나지?',ch:[
  {t:'위로금 받고 나간다 (재취업 도전)',fn:()=>unempRes('희망퇴직',S.salary*10000,{ui:true})},
  {t:'"남겠습니다." 버틴다',fn:()=>(S.boss<35&&P(.5))?unempRes('정리해고 (억까)',S.salary*10000/4,{ui:true}):{r:'버텼다. 대신 창문 없는 자리로 옮겨졌고 업무가 절반으로 줄었다. 눈치가 보인다.',fx:{mental:-15,perf:-5}}}]},
 {id:'startupfate',w:2,cool:12,cond:()=>C().startup&&S.companyMonths>=12,who:'🚀',name:'대표 (CEO)',title:'전 직원 긴급 타운홀',text:'"여러분, 중요한 발표가 있습니다…" 대표 얼굴이 묘하다. 웃는 건지 우는 건지 모르겠다.',ch:[{t:'숨죽이고 듣는다',fn:()=>{const r=Math.random();
  if(r<.18)return unempRes('회사 폐업 (스톡옵션은 휴지 조각)',0,{ui:true});
  if(r<.32){const amt=S.salary*10000*4;S.cid='big';return{r:`회사가 거대전자에 인수됐다!! 스톡옵션 현금화로 ${won(amt)}이 들어왔다. 그리고 오늘부터 나는… 대기업 직원이다.`,fx:{money:amt,mental:20}};}
  if(r<.7)return{r:'시리즈 B 투자 유치 성공! 연봉 10% 일괄 인상 + 피자 파티!',fx:{mental:12},raise:10};
  return{r:'투자 유치 실패… 전 직원 연봉 10% 삭감, "고통 분담"이란다. 대표 차는 그대로 포르쉐다. (억까)',fx:{mental:-15},raise:-10};}}]},
 {id:'passion',w:2.5,cond:()=>C().black,who:'👴',name:'사장님',title:'부조리: 우리는 가족이야',text:'"우리 회사는 가족 같은 회사야. 가족끼리 수당 따지고 그러나? 이번 주 토요일도 나와서 재고 정리 좀 하자고."',ch:[
  {t:'"네… 가족이니까요"',fx:{boss:5,hp:-8,mental:-10},r:'토요일 내내 창고에서 박스를 날랐다. 점심은 사장님이 사준 짜장면. 가족 맞네(?)'},
  {t:'노동청에 진정을 넣는다',fn:()=>P(.5)?{r:'근로감독관이 다녀갔다! 밀린 수당 일부가 들어왔다. 사장님은 나랑 눈을 안 마주친다.',fx:{money:800000,boss:-20,mental:10}}:{r:'"증거가 부족합니다." 그리고 사장님이 진정 넣은 사람이 누군지 알게 됐다.',fx:{boss:-25,mental:-10}}},
  {t:'"가족이면 월급 좀 올려주세요"',fx:{boss:-8,mental:6},r:'사장님이 "허허 이 친구 농담도…" 하고 자리를 떴다. 농담 아닌데.'}]},
 {id:'lunch',w:2,who:'🍜',name:'김부장',title:'점심 뭐 먹지',text:'"오늘 점심 뭐 먹을까? 난 아무거나 괜찮아~"',ch:[
  {t:'"짜장면 어떠세요?"',fx:{boss:-2,mental:-2},r:'"어제 먹었잖아." 결국 부장이 원래 가고 싶던 국밥집에 갔다.'},
  {t:'"부장님 좋아하시는 국밥 가시죠!"',fx:{boss:3},r:'"오 역시 뭘 좀 아네!" 이번 달 국밥 11번째다.'},
  {t:'"저는 오늘 도시락이라…" 혼밥',fx:{mental:5,peers:-2,boss:-1},r:'1시간의 자유. 유튜브 보면서 먹는 도시락이 제일 맛있다.'}]},
 {id:'meeting',w:2,who:'🗓️',name:'캘린더 알림',title:'회의를 위한 회의',text:'오늘 일정:\n09:00 주간회의 준비회의\n10:00 주간회의\n11:00 주간회의 결과 공유회의\n14:00 회의 효율화 TF 회의',ch:[
  {t:'다 참석해서 열심히 받아 적는다',fx:{hp:-3,mental:-6,boss:2},r:'회의만 하다 하루가 끝났다. 진짜 일은 6시부터 시작이다.'},
  {t:'회의 중에 몰래 내 일을 한다',fn:()=>P(.6)?{r:'회의록 쓰는 척하며 보고서를 끝냈다. 멀티태스킹의 신.',fx:{perf:3,mental:-1}}:{r:'"○○씨, 방금 내가 뭐라고 했지?" …걸렸다.',fx:{boss:-6,mental:-5},scold:1}}]},
 {id:'client',w:1.5,who:'🤬',name:'거래처 갑 부장',title:'갑질 거래처',text:'"아니 이걸 견적이라고 가져왔어요? 당신네 아니어도 할 데 많아요. 내일까지 20% 깎아서 다시 와요." 뚝.',ch:[
  {t:'밤새 다시 만든다',fx:{perf:4,hp:-6,mental:-7},r:'15% 깎은 버전과 논리를 만들어 갔다. 갑 부장이 "음…" 했다. 이 정도면 승리다.'},
  {t:'우리 부장에게 보고하고 같이 대응',fx:{boss:2,mental:-3,skill:2},r:'부장이 전화 한 통으로 정리했다. 짬은 무시 못 한다.'}]},
 {id:'headhunter',w:3.5,cool:4,cond:()=>S.jobHunt>=3,any:true,who:'📞',name:'헤드헌터',title:'스카우트 제안 도착!',text:()=>`"${S.name}님 이력 보고 연락드렸어요. ${pickTarget().name}에서 연봉 ${man(Math.round(S.salary*1.22))}에 모시고 싶다고 합니다."\n지금 연봉의 122%다.`,ch:[

 {id:'newboss',w:1,cool:24,cond:()=>S.companyMonths>=12,who:'🔄',name:'인사 발령',title:'팀장이 바뀌었다',text:'김부장이 다른 본부로 발령났다! 새로 오는 팀장은…',ch:[{t:'두근두근',fn:()=>P(.5)?{r:'칼퇴하고 칭찬 잘하는 합리적인 팀장님이다. 이게 꿈인가?',fx:{boss:15,mental:15},flagSet:['goodBoss',true]}:{r:'…김부장보다 더한 사람이 왔다. "나 때는 말이야"를 하루 12번 한다. 김부장이 그리워질 줄이야.',fx:{boss:-10,mental:-12},flagSet:['goodBoss',false]}}]},
 {id:'talent',w:1.2,cool:120,cond:()=>S.rank<=1,who:'🎤',name:'인사팀',title:'워크숍 장기자랑',text:'"워크숍 마지막 날 밤, 저연차 장기자랑이 있습니다! 1등은 상품권 30만 원!"\n(자율이라는데 명단에 이미 내 이름이 있다)',ch:[

 {id:'ceo',w:1,who:'👑',name:'사장님',title:'사장님 순시',text:'사장님이 사무실을 돌다가 내 자리 앞에서 멈췄다. "자네, 요즘 회사 생활 어때? 솔직하게 말해봐."',ch:[

  {t:'진짜 솔직하게 말한다 (야근, 회의…)',fn:()=>P(.3)?{r:'사장님이 메모를 했다. 다음 달 "회의 줄이기 캠페인"이 시작됐다! (회의가 하나 늘었다)',fx:{mental:8,perf:3}}:{r:'사장님 표정이 굳었다. 오후에 부장이 불렀다. "자네 사장님한테 무슨 말을 한 거야?"',fx:{boss:-12,mental:-5},scold:1}}]},
 {id:'coin',w:1.2,cool:8,any:true,who:'📈',name:'옆자리 동기',title:'야 이거 무조건 오른대',text:'"야, 이 코인 무조건 간대. 우리 팀 과장님도 넣었어. 너도 한 300만 넣어봐."',ch:[

 {id:'checkup',w:2,cool:10,any:true,cond:()=>S.hp<45,who:'🏥',name:'건강검진 결과',title:'재검 소견',text:'건강검진 결과지: 위염, 거북목, 지방간 의심, 안구건조증.\n"스트레스 관리가 필요합니다."',ch:[

 {id:'wedding',w:1.5,cool:6,who:'💌',name:'청첩장',title:'부장님 따님 결혼식',text:'부장 딸 결혼식 청첩장이 책상에 놓였다. 일요일 낮 12시, 강남. 축의금은… 얼마 해야 하지?',ch:[

 {id:'mz',w:1.5,cond:()=>S.rank>=2,who:'🎧',name:'신입 사원',title:'나도 꼰대인가?',text:'신입이 에어팟 끼고 일하다 5시 59분에 가방을 쌌다. "내일 뵙겠습니다~"\n팀 업무는 아직 산더미인데.',ch:[

 {id:'harass',w:1.5,cond:()=>S.boss<40,who:'💢',name:'김부장',title:'공개 망신',text:'회의 중에 부장이 내 보고서를 집어 던졌다. "이걸 보고서라고 써 왔어? 대학은 나왔어?"\n15명이 보고 있다.',ch:[

  {t:'녹음해서 직장 내 괴롭힘으로 신고',fn:()=>P(.5)?{r:'괴롭힘이 인정됐다. 부장은 징계와 함께 다른 팀으로 갔다! 동료들이 몰래 엄지척을 날린다.',fx:{mental:10,peers:8,boss:30},flagSet:['goodBoss',true]}:{r:'"양측 진술이 엇갈려 판단이 어렵다." 흐지부지. 부장과 나는 같은 팀에 그대로 있다.',fx:{mental:-10,boss:-10}}},

 {id:'rotation',w:2,cool:24,cond:()=>C().safe&&S.companyMonths>=18,who:'🔄',name:'인사 발령',title:'순환보직',text:'이제 막 업무에 익숙해졌는데 순환보직으로 전혀 다른 부서(시설관리팀)로 발령이 났다.',ch:[{t:'받아들인다',fx:{skill:-6,mental:-5,peers:3},r:'처음부터 다시 배운다. 보일러 점검표가 내 새 친구다.'}]},
 {id:'mentor',w:1.5,cool:999,cond:()=>S.careerMonths<=24,who:'🧑‍🏫',name:'사수 이대리',title:'사수의 꿀팁',text:'"야, 보고서는 결론부터 써. 부장님은 첫 장만 봐. 그리고 금요일 오후엔 절대 보고 올리지 마."',ch:[{t:'메모한다',fx:{skill:4,peers:3},r:'인생 꿀팁 노트 1페이지 완성.'}]},
 {id:'crash',w:1.5,who:'💻',name:'회사 PC',title:'억까: 블루스크린',text:'보고서 마감 30분 전. 윈도우 업데이트가 강제로 시작되더니… 파란 화면. 마지막 저장은 3시간 전.',ch:[

 {id:'salarytalk',w:1.2,cool:60,who:'🤫',name:'동기 단톡방',title:'억까: 연봉 공개 사건',text:'동기 하나가 술김에 연봉을 깠다. 같은 해 입사, 같은 직급… 근데 나보다 400만 원 더 받는다. 이유는 "협상을 잘해서"라고.',ch:[
  {t:'인사팀에 따진다',fn:()=>P(.25)?{r:'인사팀이 "검토해보겠다"더니 진짜로 조정해줬다! 연봉 3% 인상.',fx:{mental:5},raise:3}:{r:'"개인 연봉은 비밀유지 대상입니다. 누가 알려줬죠?" 오히려 동기가 곤란해졌다.',fx:{mental:-8,peers:-4}}},

 {id:'abroad',w:1,cool:120,cond:()=>S.rank>=2&&S.rank<=3&&!C().black&&!C().startup,who:'✈️',name:'해외사업팀',title:'해외 주재원 기회',text:'"베트남 법인 주재원 자리가 났는데, 자네 생각 있나? 3년 코스야. 해외수당 나오고, 다녀오면 승진에 유리하지."',ch:[

 {id:'bigproj',w:1.5,cool:18,cond:()=>S.rank>=2&&S.rank<=4,who:'🧑‍💼',name:'본부장',title:'대형 프로젝트 PM 제안',text:'"이번 차세대 시스템 프로젝트, 자네가 PM 맡아봐. 성공하면 확실히 밀어줄게. 실패하면… 알지?"',ch:[

 {id:'reunion',w:1,cool:24,any:true,who:'🍺',name:'동창회',title:'동창회 연봉 배틀',text:()=>`오랜만의 대학 동창회. 다들 은근히 연봉 얘기를 꺼낸다. "너 요즘 얼마 받냐?"\n(내 연봉: ${man(S.salary||0)})`,ch:[

 {id:'marry',w:1.5,cool:18,any:true,cond:()=>!S.life.married&&S.age>=29&&S.age<=40,who:'💍',name:'연인',title:'결혼 이야기',text:'오래 만난 연인이 조심스럽게 말했다. "우리… 이제 결혼할까?"\n결혼식·신혼 준비에 목돈이 들 거다.',ch:[

 {id:'baby',w:1.2,cool:24,any:true,cond:()=>S.life.married&&S.life.kids<2&&S.age<=44,who:'👶',name:'가족',title:'아기가 생겼다!',text:'배우자가 두 줄 테스트기를 보여줬다. 아기가 생겼다!',ch:[

 {id:'house',w:1.5,cool:12,any:true,cond:()=>!S.life.house&&S.money>=120000000,who:'🏠',name:'공인중개사',title:'내 집 마련의 기회',text:()=>{S.flags.hp=Math.min(R(3,9)*100000000,Math.floor(S.money*.9/.35/10000000)*10000000);return `"이 아파트 ${eok(S.flags.hp)}인데요, 지금 안 사면 또 오릅니다~"\n모아둔 돈이 ${won(S.money)} 있다. 계약금·중도금으로 35%를 내고, 나머지 65%는 주택담보대출(금리 4.5%, 30년)로 해야 한다.`;},ch:[
  {t:'영끌해서 산다!',fn:()=>{const price=S.flags.hp;const down=Math.round(price*.35);const loan=price-down;S.life.house=true;S.life.houseVal=price;S.life.loan=loan;S.life.loanPay=Math.round((loan*.045/12/(1-Math.pow(1+.045/12,-360)))/1000)*1000;return{r:`계약했다! 등기부등본에 내 이름이 찍혔다. 대출 ${eok(loan)}, 매달 원리금 ${won(S.life.loanPay)}. 이제 월세는 끝이다.`,fx:{money:-down,mental:12}};}},

function pickTarget(){if(!S.flags.ttarget||S.flags.ttarget===S.cid){const pool=COMPANIES.filter(c=>c.id!==S.cid&&!c.black);S.flags.ttarget=pick(pool).id;}return COMPANIES.find(c=>c.id===S.flags.ttarget);}
function pickEvent(){const ex=isExec();const pool=EVENTS.filter(e=>(ex?(e.exec||e.any):!e.exec)&&(!e.cond||e.cond())&&!((S.cool[e.id]||0)>S.careerMonths));
 if(!pool.length)return null;let tot=pool.reduce((a,e)=>a+(e.w||1),0),r=Math.random()*tot;for(const e of pool){r-=(e.w||1);if(r<=0)return e;}return pool[pool.length-1];}
function runEvent(ev,next,isFixed){if(!isFixed)S.cool[ev.id]=S.careerMonths+(ev.cool||3);
 const text=typeof ev.text==='function'?ev.text():ev.text;const chs=ev.ch.filter(c=>!c.cond||c.cond());
 screen(()=>hud()+sceneCard(ev.who,ev.name,ev.title,text,chs.map(c=>`<button onclick="${b(()=>choose(ev,c,next))}">${c.t}</button>`).join(''))+logBox());}
function choose(ev,c,next){const res=c.fn?c.fn():{r:c.r,fx:c.fx};
 if(c.corrupt)S.corruption+=c.corrupt;if(c.flag)S.flags[c.flag]=true;if(c.line){S.line=c.line==='none'?null:c.line;S.flags.lineYear=S.cal;}
 if(c.life)Object.keys(c.life).forEach(k=>{if(k==='kids')S.life.kids+=c.life.kids;else S.life[k]=c.life[k];});
 if(c.scold||res.scold)S.stats.scold++;if(res.flagSet)S.flags[res.flagSet[0]]=res.flagSet[1];if(res.reset)S.corruption=0;
 if(ev.after)ev.after();
 if(res.end)return ending(res.end);
 if(res.unemp){if(res.fx)apply(res.fx);return unemploy(res.unemp.reason,res.unemp.extra,res.unemp.opt);}
 if(res.sw)return switchCompany(res.up,next);

 const ch=apply(res.fx);if(res.raise){S.salary=Math.round(S.salary*(1+res.raise/100));ch.push(['salary',res.raise]);}
 log(ev.title);showResult(ev.title,res.r,ch,()=>guard(next),'다음 ▶',ev.who);}

function sisal(why,intro,next,attempt=1,prev){const day=(prev&&prev.day)||R(1,28);

function promote(next,msg){S.rank++;S.yearsInRank=0;S.promoPts=0;S.stats.promos++;const pr=C().black?3:R(8,12);S.salary=Math.round(S.salary*(1+pr/100));S.mental=clamp(S.mental+15,0,100);S.boss=clamp(S.boss+5,0,100);log(`🎉 ${RANKS[S.rank]} 승진!`);setKpi();
 screen(()=>hud()+`<section class="card"><div class="bigicon">🎉</div><h2 style="text-align:center;font-size:34px">${RANKS[S.rank]} 승진!</h2><div class="txt">${msg}\n\n사내 게시판 인사발령: <b>${S.name} ${RANKS[S.rank-1]} → ${RANKS[S.rank]}</b>\n승진 인상 +${pr}% → 연봉 ${man(S.salary)}${C().black?' (승진했는데 3%밖에 안 오름. 직함만 바뀌었다)':''}</div>
 ${chipsHtml([['salary',pr],['mental',15]])}<button class="btn main" onclick="${b(next)}">명함 새로 파러 가기 ▶</button></section>`,confetti);}
function promoProcess(next){const c=C();const pr=PROMO[S.rank];S.stats.exams++;
 if(S.flags.toPriority){S.flags.toPriority=false;return promote(next,'작년에 TO 부족으로 밀렸던 승진이 우선 반영됐다!');}
 const onPass=()=>{if(P(.12)){S.flags.toPriority=true;S.promoCand=false;apply({mental:-12});return showResult('😤 억까: 합격했는데 TO 부족','심사는 통과했다. 그런데 "올해 승진 TO가 하나뿐이라 사장님 조카가 먼저 달기로 했어. 내년엔 자동으로 승진시켜 줄게."\n…진짜죠?',[['mental',-12]],next,'다음 ▶','😤');}promote(next,'심사를 통과했다!');};
 const onFail=msg=>{apply({mental:-10});log('승진 실패');showResult('😞 승진 탈락',msg+'\n\n승진 포인트는 유지된다. 내년 12월 평가 후 다시 심사 대상이 될 수 있다.',[['mental',-10]],next,'다음 ▶','😞');};
 if(c.black)return screen(()=>hud()+sceneCard('👴','사장님','승진 면담',`"자네 ${RANKS[S.rank+1]} 달고 싶어? 우리 회사는 시험 같은 거 없어. 내 마음이 시험이야."`,[['"평생 충성하겠습니다!"',.6],['"성과로 증명하겠습니다"',.4]].map(([t,p])=>`<button onclick="${b(()=>P(p)?promote(next,'사장님 재량으로 승진이 결정됐다. "그래, 그 맛이지!"'):onFail('"말로만?" 사장님 마음이 아직 안 열렸다.'))}">${t}</button>`).join('')));
 const type=c.safe?'quiz':pr.exam;
 screen(()=>hud()+`<section class="card"><div class="bigicon">📢</div><h2 style="text-align:center">${S.cal}년 정기 승진 심사</h2>
 <div class="txt">인사팀 공지: <b>${S.name} ${RANKS[S.rank]}</b>님은 <b>${RANKS[S.rank+1]}</b> 승진 심사 대상자입니다.\n\n${type==='quiz'?`📝 <b>필기 승진시험</b> — 직무·회계·엑셀·노동법 6문항, 문항당 15초.\n4문항 이상 맞히면 합격. 보유 힌트(50:50): <b>${S.hints}개</b>`:`🎤 <b>승진 PT 면접 + 심사</b> — 임원진 앞에서 3개 질문에 답한다.\n면접 점수와 함께 상사 호감(${S.boss}) 40 이상, 동료 관계(${S.peers}) 30 이상이 필요하다.`}</div>
 <button class="btn main" onclick="${b(()=>type==='quiz'?quiz({qs:shuffle(QUIZ).slice(0,6).map(q=>({q:q[0],opts:shuffle(q[1].map((t,i)=>({t,ok:i===0}))),ex:q[2]})),i:0,score:0},s=>s>=4?onPass():onFail(`6문제 중 ${s}개 맞혔다. 합격선은 4개. 회계 문제에서 무너졌다.`)):pt(0,0,shuffle(PT_QS).slice(0,3),s=>{const tot=s+(S.skill-50)/25;if(tot>=3&&S.boss>=40&&S.peers>=30)onPass();else onFail(tot<3?'면접에서 임원진의 표정이 좋지 않았다.':S.boss<40?'면접은 괜찮았지만 상사 평가가 발목을 잡았다.':'다면평가에서 동료 점수가 너무 낮았다.');}))}">시험장 입장 ▶</button></section>`);}
function quiz(Q,done){if(Q.i>=Q.qs.length){const s=Q.score;return showResult('📝 시험 종료',`6문항 중 ${s}문항 정답!${s>=4?'\n합격선(4문항)을 넘었다. 이제 최종 심사만 남았다…':''}`,[],()=>done(s),'결과 확인 ▶',s>=4?'🙆':'🙅');}
 const q=Q.qs[Q.i];window._q=q;const tk=TK+1;
 const answer=(ok,timeout)=>{if(ok)Q.score++;const nx=()=>{Q.i++;quiz(Q,done);};
  screen(()=>hud()+`<section class="card"><h2>📝 문제 ${Q.i+1}/6 — ${timeout?'⏰ 시간 초과!':ok?'⭕ 정답!':'❌ 오답'}</h2><div class="txt">${q.q}</div>
  ${q.opts.map(o=>`<div class="qopt ${o.ok?'ok':''}">${o.ok?'✅ ':''}${o.t}</div>`).join('')}<div class="info">💡 ${q.ex}</div>
  <button class="btn main" onclick="${b(nx)}">다음 ▶</button></section>`);};
 screen(()=>hud()+`<section class="card"><div class="aphead"><h2>📝 승진시험 ${Q.i+1}/6</h2><span class="k">현재 ${Q.score}점</span>
 ${S.hints>0&&!q.hinted?`<button class="btn sm" style="margin-left:auto" onclick="${b(()=>{S.hints--;q.hinted=true;let n=0;q.opts.forEach(o=>{if(!o.ok&&n<2){o.gone=true;n++;}});quiz(Q,done);})}">🔍 50:50 힌트 (${S.hints})</button>`:''}</div>
 <div class="timer"><div id="tm"></div></div><div class="txt">${q.q}</div>
 ${q.opts.map(o=>`<button class="qopt ${o.gone?'gone':''}" onclick="${b(()=>answer(o.ok))}">${o.t}</button>`).join('')}</section>`,
 ()=>{if(!CAN_ANIM)return;const tm=$id('tm');requestAnimationFrame(()=>{tm.style.transitionDuration='15s';tm.style.width='0%';});setTimeout(()=>{if(TK===tk)answer(false,true);},15000);});}
function pt(i,score,qs,done){if(i>=qs.length)return done(score);const q=qs[i];
 screen(()=>hud()+sceneCard('🧑‍⚖️',`승진 PT 면접 · 질문 ${i+1}/${qs.length} · 임원 3명`,'🎤 승진 면접',q.q,q.ch.map(o=>`<button onclick="${b(()=>pt(i+1,score+(typeof o.s==='function'?o.s():o.s),qs,done))}">${o.t}</button>`).join('')));}
function execSelection(next){const c=C();const p=clamp(.28+(S.boss-60)/100+(S.flags.promoBoost?.15:0)+(S.lastGrade==='S'?.15:0)+(S.flags.hero?.05:0)-(c.black?.2:0)-(c.safe?.1:0),.05,.85);
 screen(()=>hud()+`<section class="card"><div class="bigicon">🌟</div><h2 style="text-align:center">${S.cal}년 정기 임원 인사</h2><div class="txt">오늘 오전 10시, 임원 인사 명단이 발표된다. 부장 ${S.yearsInRank}년차. 이번엔 될까?\n\n예상 확률: 약 ${Math.round(p*100)}% (회장 신임·평가 등급·라인에 따라 달라짐)</div>
 <button class="btn gold" onclick="${b(()=>{if(P(p)){S.rank=5;S.yearsInRank=0;S.salary=Math.max(Math.round(S.salary*1.3),EXEC_SAL[5]);S.rate=100;S.boss=55;S.stats.promos++;log('🌟 상무 승진 (임원)');

  else{apply({mental:-8});showResult('😶 명단에 없다','명단을 세 번 확인했다. 내 이름은 없었다. 동기 박부장 이름이 있었다.\n(올해 평가에서 다시 후보가 될 수 있다)',[['mental',-8]],next,'다음 ▶','😶');}})}">📜 명단 확인하기</button></section>`);}

function buildWorld(ex){const g=[...Array(GH)].map(()=>Array(GW).fill(0));const W=(x,y)=>{g[y][x]=1;};
 for(let x=0;x<GW;x++){W(x,0);W(x,GH-1);}for(let y=0;y<GH;y++){W(0,y);W(GW-1,y);}
 for(let y=1;y<=7;y++)if(y!==4)W(9,y);for(let x=1;x<=8;x++)if(x!==6)W(x,7);
 for(let x=1;x<=8;x++)if(x!==4)W(x,10);for(let y=10;y<=16;y++)if(y!==13)W(8,y);
 for(let y=11;y<=16;y++)if(y!==14)W(23,y);for(let x=23;x<=28;x++)W(x,11);

  {id:'screen',x:3,y:1,w:4,h:1,k:'screen'},{id:'table_m',x:3,y:3,w:4,h:2,k:'mtable'},

  {id:'plant_ceo',x:28,y:9,w:1,h:1,k:'bigplant'},
  {id:'door',x:14,y:17,w:3,h:1,k:'door',wall:true},{id:'toilet',x:29,y:5,w:1,h:2,k:'toilet',wall:true},
  {id:'p1',x:10,y:1,w:1,h:1,k:'plant'},{id:'p2',x:22,y:1,w:1,h:1,k:'plant'},{id:'p3',x:12,y:16,w:1,h:1,k:'plant'},{id:'p4',x:18,y:16,w:1,h:1,k:'plant'},{id:'p5',x:28,y:1,w:1,h:1,k:'plant'},
  desk('d1',11,4,true),desk('d2',15,4,true),desk('d3',19,4,true),desk('d4',11,8,false),desk('d5',15,8,false),desk('d6',19,8,false),desk('d7',11,12,false),desk(ex?'d8':'desk_me',15,12,false),desk('d9',19,12,false),
 ];
 O.forEach(o=>{if(o.wall)return;for(let y=o.y;y<o.y+o.h;y++)for(let x=o.x;x<o.x+o.w;x++)g[y][x]=2;});
 return{grid:g,objs:O};}
function roomOf(x,y){const tx=Math.floor(x),ty=Math.floor(y);if(tx<=8&&ty<=6)return'meet';if(tx<=7&&ty>=11)return'pantry';if(tx>=24&&ty>=12)return'store';return'office';}
function freeT(x,y){return x>=0&&y>=0&&x<GW&&y<GH&&G.grid[y][x]===0;}
function canStand(x,y){const r=.27;return freeT(Math.floor(x-r),Math.floor(y-r))&&freeT(Math.floor(x+r),Math.floor(y-r))&&freeT(Math.floor(x-r),Math.floor(y+r))&&freeT(Math.floor(x+r),Math.floor(y+r));}
function bfs(sx,sy,isGoal){sx=clamp(Math.floor(sx),0,GW-1);sy=clamp(Math.floor(sy),0,GH-1);const N=GW*GH,prev=new Int32Array(N).fill(-1),seen=new Uint8Array(N);const q=[sy*GW+sx];seen[q[0]]=1;let h=0;
 while(h<q.length){const k=q[h++],x=k%GW,y=(k/GW)|0;if(isGoal(x,y)){const p=[];let c=k;while(c!==sy*GW+sx){p.push({x:c%GW,y:(c/GW)|0});c=prev[c];}return p.reverse();}
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=GW||ny>=GH)continue;const nk=ny*GW+nx;if(seen[nk]||G.grid[ny][nx])continue;seen[nk]=1;prev[nk]=k;q.push(nk);}}
 return null;}
function rectDist(px,py,o){const dx=Math.max(o.x-px,0,px-(o.x+o.w)),dy=Math.max(o.y-py,0,py-(o.y+o.h));return Math.hypot(dx,dy);}
const objById=id=>G.objs.find(o=>o.id===id);
const npcById=id=>G.npcs.find(n=>n.id===id);

function mkEnt(id,look,tx,ty,face){const e={id,name:id==='me'?S.name:NPC_NAMES[id],look:LOOKS[look],x:tx+.5,y:ty+.5,dir:face||'down',path:[],spd:id==='me'?4.3:2.6,state:'idle',ph:0,seed:Math.random()*1000,emote:null,say:null,moving:false,carry:null,mood:'',onArrive:null};return e;}
function setSeat(e,tx,ty,face,cx){e.seat={tx,ty,face,px:cx,py:ty+.5};}
function sitDown(e){if(!e.seat)return;e.x=e.seat.px;e.y=e.seat.py;e.state='sit';e.dir=e.seat.face;e.path=[];e.moving=false;}
function walkTo(e,isGoal,onArrive){const p=bfs(e.x,e.y,isGoal);if(!p){if(onArrive)onArrive(false);return false;}e.path=p;e.state='walk';e.onArrive=onArrive||null;if(!p.length&&onArrive){e.onArrive=null;onArrive(true);}return true;}
const nearObj=o=>(x,y)=>rectDist(x+.5,y+.5,o)<=.75;
const nearPt=(px,py,r=1)=>(x,y)=>Math.abs(x+.5-px)+Math.abs(y+.5-py)<=r+.01&&!(Math.floor(px)===x&&Math.floor(py)===y);
function goSeat(e){if(!e.seat)return;walkTo(e,(x,y)=>x===e.seat.tx&&y===e.seat.ty,()=>sitDown(e));}
function goHome(e){walkTo(e,(x,y)=>x===15&&y===16,()=>{e.state='gone';e.x=-5;});}
function say(e,txt,ms=3500){if(!e)return;e.say={txt,until:performance.now()+ms};}
function emote(e,txt,ms=2500){if(!e)return;e.emote={txt,until:performance.now()+ms};}

function startDay(){if(!CAN_ANIM)return officeScreen();S.notices=S.notices||[];const ex=isExec();const w=buildWorld(ex);
 G={active:true,modal:false,paused:false,ex,grid:w.grid,objs:w.objs,min:9*60,speed:1,rate:2.3,tasks:[],done:[],failed:[],scolds:0,sched:[],evq:[],npcs:[],fx:[],keys:{},
  last:0,hudT:0,ringT:0,footT:0,acc:{hp:0,mental:0},catchCD:0,pantryMin:0,toiletUses:0,coffeeCups:0,lunch:false,hoesik:false,annH:false,ann18:false,sisal:null,approach:null,
  perf0:S.perf,rate0:S.rate,snap:{hp:S.hp,mental:S.mental,boss:S.boss,peers:S.peers,money:S.money},shakeUntil:0,near:null};
 const me=mkEnt('me','me',15,13);G.me=me;
 const seats=ex?{kim:[15,13,'up',16],lee:[11,9,'up',12],choi:[15,9,'up',16],park:[11,13,'up',12],jung:[19,13,'up',20],han:[15,3,'down',16],kang:[11,3,'down',12]}
  :{boss:[25,2,'down',25.5],lee:[11,9,'up',12],choi:[15,9,'up',16],park:[11,13,'up',12],jung:[19,13,'up',20],han:[15,3,'down',16],kang:[11,3,'down',12]};
 for(const id in seats){const [tx,ty,f,cx]=seats[id];const e=mkEnt(id,id==='kim'?'boss':id,tx,ty,f);setSeat(e,tx,ty,f,cx);sitDown(e);e.nextWander=9*60+R(20,120);G.npcs.push(e);}
 if(ex)setSeat(me,25,2,'down',25.5);else setSeat(me,15,13,'up',16);sitDown(me);
 G.boss=ex?null:npcById('boss');if(G.boss)G.boss.nextPatrol=9*60+R(40,80);
 G.npcs.forEach(n=>{if(n.id!=='boss')n.leaveAt=18*60+R(0,45);});if(G.boss)G.boss.leaveAt=18*60+R(30,100);
 planDay();
 screen(liveHtml,()=>{initCanvas();bindLive();G.last=performance.now();G.raf=requestAnimationFrame(loop);
  const tips=[...(S.notices||[])];S.notices=[];tips.forEach((t,i)=>setTimeout(()=>toast(t,'good'),300+i*600));
  setTimeout(()=>toast(ex?'🤵 출근 완료. 오늘도 실적을 지켜내자.':`🏢 ${S.cal}년 ${S.month}월, 출근! 할 일이 생기면 아래 카드에 뜬다.`),100);
  if(!store('osLiveTut'))tutorial();});}
function planDay(){const ex=G.ex;const pool=ex?EXEC_POOL:STAFF_POOL.filter(k=>!TASKS[k].minRank||S.rank>=TASKS[k].minRank);
 const n=ex?5:5+Math.min(2,Math.floor(S.rank/2))+R(0,1);const picks=[];if(!ex&&P(.7))picks.push('report');
 let guard_=0;while(picks.length<n&&guard_++<200){const k=pick(pool);if(picks.filter(x=>x===k).length>=(k==='phone'||k==='coffee'?2:1))continue;picks.push(k);}
 let t=9*60+R(5,15);shuffle(picks).forEach(k=>{t+=R(22,62);if(t>=12*60&&t<13*60)t=13*60+R(0,15);if(t>17*60+20)t=17*60+R(0,20);G.sched.push({t,k});});
 if(P(.55))G.sched.push({t:pick([10*60+30,14*60+30,15*60+30]),k:ex?'meetx':'meet'});
 G.sched.sort((a,b)=>a.t-b.t);
 const ne=R(1,2);for(let i=0;i<ne;i++)G.evq.push({t:R(10*60,17*60+20)});G.evq.sort((a,b)=>a.t-b.t);
 G.hoesik=ex?P(.12):P(.32);}

 G.shade=document.createElement('canvas');G.shade.width=GW*TS;G.shade.height=GH*TS;G.shadeCtx=G.shade.getContext('2d');}
function bindLive(){const kd=e=>{if(!G)return;if(G.modal){if(G.modalKey)G.modalKey(e);return;}const k=e.key.toLowerCase();

  if(k==='escape'){pauseMenu();return;}if(k==='e'||k===' '){if(!e.repeat&&G.near)interact(G.near);return;}G.keys[k]=true;};
 const ku=e=>{if(G)G.keys[e.key.toLowerCase()]=false;};
 window.addEventListener('keydown',kd);window.addEventListener('keyup',ku);G.unbind=()=>{window.removeEventListener('keydown',kd);window.removeEventListener('keyup',ku);};
 G.cv.addEventListener('pointerdown',e=>{if(!G||G.modal)return;const r=G.cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*GW,y=(e.clientY-r.top)/r.height*GH;clickWorld(x,y);});
 $id('actBtn').addEventListener('click',()=>{if(G&&G.near)interact(G.near);});

/* ---------- 입력·상호작용 ---------- */
function clickWorld(x,y){const me=G.me;
 const n=G.npcs.find(n=>n.state!=='gone'&&!n.hidden&&Math.hypot(n.x-x,n.y-.35-y)<.75);if(n)return gotoTarget({npc:n});
 const o=G.objs.find(o=>x>=o.x&&x<o.x+o.w&&y>=o.y&&y<o.y+o.h&&labelFor({obj:o}));if(o)return gotoTarget({obj:o});
 const tx=Math.floor(x),ty=Math.floor(y);standUp();if(freeT(tx,ty))walkTo(me,(a,b)=>a===tx&&b===ty);else walkTo(me,nearPt(x,y,1.5));}
function standUp(){const me=G.me;if(me.state==='sit'||me.state==='rest'){me.x=Math.floor(me.x)+.5;me.y=Math.floor(me.y)+.5;if(!canStand(me.x,me.y)){const p=bfs(me.x,me.y,(x,y)=>freeT(x,y));if(p&&p.length){const q=p[p.length-1];me.x=q.x+.5;me.y=q.y+.5;}else{me.x=me.seat.tx+.5;me.y=me.seat.ty+.5;}}me.state='idle';}}
function gotoTarget(tg){standUp();const me=G.me;const goal=tg.npc?nearPt(tg.npc.x,tg.npc.y,1.2):nearObj(tg.obj);
 if(inRange(tg)){interact(tg);return;}walkTo(me,goal,ok=>{if(ok&&G&&G.active&&!G.modal&&inRange(tg)&&(taskAtTarget(tg)||!(tg.obj&&tg.obj.id==='door')))interact(tg);});}
function gotoAt(at){const tg=resolveAt(at);if(!tg){toast('🤔 지금은 거기로 갈 수 없어');return;}gotoTarget(tg);}
function resolveAt(at){if(at==='boss'){const b=G.boss;if(b&&b.state!=='gone')return{npc:b};return{obj:objById('bossdesk')};}
 if(at.startsWith('npc:')){const n=npcById(at.slice(4));return n&&n.state!=='gone'?{npc:n}:null;}const o=objById(at);return o?{obj:o}:null;}
function inRange(tg){const me=G.me;if(tg.npc)return Math.hypot(tg.npc.x-me.x,tg.npc.y-me.y)<=1.45;return rectDist(me.x,me.y,tg.obj)<=.8;}
function sameTg(a,b){return a&&b&&((a.npc&&b.npc&&a.npc===b.npc)||(a.obj&&b.obj&&a.obj===b.obj));}
function doable(t){const st=t.steps[t.step],prev=t.steps[t.step-1],c=G.me.carry;const needs=prev&&prev.carry&&!st.carry?prev.carry:null;if(needs)return c===needs;if(st.carry&&!st.game)return !c||c===st.carry;return true;}
function taskAtTarget(tg){const ts=G.tasks.slice().sort((a,b)=>(doable(b)-doable(a))||(a.due-b.due));for(const t of ts){const r=resolveAt(t.steps[t.step].at);if(sameTg(r,tg))return t;}return null;}
function labelFor(tg){const t=taskAtTarget(tg);if(t)return `${t.def.ic} ${t.steps[t.step].t}`;
 if(tg.npc){const n=tg.npc;if(n.id==='boss')return '🙇 부장님께 아부 떨기';if(n.id==='chair')return '🙇 회장님께 인사';return `💬 ${n.name}와 수다`;}
 switch(tg.obj.id){case'cooler':return'💧 물 마시기';case'coffee':return'☕ 커피 마시기';case'fridge':return'🍮 냉장고 간식 꺼내먹기';case'sofa':return'🛋️ 소파에서 쉬기 (땡땡이)';case'toilet':return'🚻 화장실에 숨기';
  case'desk_me':return'💻 집중 근무 (30분)';case'door':return G.min>=18*60?'🏠 퇴근하기':'🏃 조퇴하기';case'table_m':return'🤫 빈 회의실에서 몰래 쉬기';case'printer':return'🖨️ 복합기 툭툭 치기';case'plant_ceo':return'🪴 사장님 화분 구경';}return null;}
function findNear(){const me=G.me;let best=null,bd=9;
 G.npcs.forEach(n=>{if(n.state==='gone'||n.hidden)return;const d=Math.hypot(n.x-me.x,n.y-me.y);if(d<=1.45&&d<bd){bd=d;best={npc:n};}});
 G.objs.forEach(o=>{const d=rectDist(me.x,me.y,o);if(d<=.8){const tg={obj:o};if(!labelFor(tg))return;const pr=taskAtTarget(tg)?-1:0;if(d+pr<bd){bd=d+pr;best=tg;}}});
 if(best){const t=taskAtTarget(best);if(!t&&best.npc){/* 업무 대상이 아닌 npc보다 업무 사물이 가까우면 */}}
 return best;}
function interact(tg){if(!tg||!G||G.modal)return;const t=taskAtTarget(tg);if(t)return doStep(t);genericAct(tg);}
function skip(min,label){G.min+=min;floatAt(G.me,`⏩ ${label||min+'분'}`,'#a5b4fc');}
function genericAct(tg){const me=G.me;
 if(tg.npc){const n=tg.npc;if((n.chatCD||0)>G.min){say(n,pick(['지금 바빠~','이따 얘기해!','…(모니터만 봄)']));return;}n.chatCD=G.min+60;n.dir=dirTo(n,me);
  if(n.id==='boss'){say(n,pick(['허허, 자네 오늘 셔츠 좋네','아부는 됐고 일이나 해~','그래그래, 열심히 하고']));say(me,pick(['부장님 오늘 넥타이 멋지십니다!','부장님 피부 좋아지셨어요!','역시 부장님이십니다!']));gain({boss:3,mental:-2});skip(5);Snd.sfx('haha');return;}
  if(n.id==='chair'){say(n,'자네 수고가 많아');gain({boss:2});return;}
  say(n,pick(CHAT[n.id]||['하하']));say(me,pick(['ㅋㅋㅋ 그러게','진짜요?','헐 대박']));gain({peers:2,mental:2});skip(10,'10분 수다');
  if(n.id==='park'&&P(.3)){gain({mental:-3});say(n,'아 그리고 이것 좀 대신 해줘~ ㅎㅎ');later(()=>spawnTask('shred'));}return;}
 const o=tg.obj;switch(o.id){
  case'cooler':gain({hp:2});skip(3);Snd.sfx('glug');say(me,'캬~ 시원하다');break;
  case'coffee':G.coffeeCups++;if(G.coffeeCups>3){gain({mental:-2,hp:1});say(me,'심장이 두근두근… 카페인 과다');}else{gain({hp:6,mental:2});say(me,'☕ 살 것 같다');}skip(10);Snd.sfx('pour');break;

 if(k==='parcel'){const c=G.npcs.filter(n=>!['boss','chair','kim'].includes(n.id)&&n.state!=='gone');const who=pick(c.length?c:G.npcs);t.data.to=who.id;t.steps[1].at='npc:'+who.id;t.steps[1].t=`${who.name}에게 전달`;}

function spawnChair(){if(npcById('chair'))return;const c=mkEnt('chair','chair',15,16,'up');G.npcs.push(c);c.visitor=true;walkTo(c,nearPt(G.me.seat.px,G.me.seat.py+1,1.5),()=>{c.state='idle';c.dir='up';});}
function gatherMeeting(t){const spots=[[2,3],[7,3],[2,4],[7,4],[4,5],[5,5]];const who=G.npcs.filter(n=>n.state!=='gone'&&!n.visitor).slice(0,4);
 who.forEach((n,i)=>{const [x,y]=spots[i];n.inMeeting=true;walkTo(n,(a,b)=>a===x&&b===y,()=>{n.state='idle';n.dir=x<5?'right':'left';});});t.data.who=who;}

function doStep(t){const st=t.steps[t.step],prev=t.steps[t.step-1];const me=G.me;
 const needs=prev&&prev.carry&&!st.carry?prev.carry:null;
 if(needs&&me.carry!==needs){toast(`🙌 먼저 ${CARRY_N[needs]}을(를) 들고 와야 해!`,'bad');return;}
 if(st.carry&&me.carry&&me.carry!==st.carry){toast(`🙌 손이 꽉 찼어! 들고 있는 ${CARRY_N[me.carry]}부터 처리하자`,'bad');return;}
 if(t.k==='coffee'&&t.step===1){me.carry=null;const b=G.boss;if(t.data.ok){say(b,'음~ 이 맛이지! 센스 있어');emote(b,'😊');completeTask(t,true);}else{say(b,`이게 뭐야? 내가 ${t.data.order.temp} ${t.data.order.drink}라고 했잖아!`,4500);emote(b,'💢');b.mood='angry';later(()=>{if(b)b.mood='';},4000);completeTask(t,false);}return;}
 if(st.game)return openGame(st.game,t,(ok,val)=>afterGame(t,st,ok,val));
 if(needs)me.carry=null;
 if(st.carry){me.carry=st.carry;Snd.sfx('pickup');floatAt(me,`${CARRY_N[st.carry]} 들었다`,'#fde68a');}
 if(st.at.startsWith('npc:')){const n=npcById(st.at.slice(4));if(n){n.dir=dirTo(n,me);say(n,t.k==='cheer'?pick(['상무님 감사합니다!','힘이 납니다!','열심히 하겠습니다!']):t.k==='parcel'?'오 내 택배! 고마워~':'고마워~');emote(n,'😊');}}

function advance(t){t.step++;if(t.step>=t.steps.length)completeTask(t,true);else toast(`➡️ ${t.def.ic} 다음: ${t.steps[t.step].t}`);}

 const d=t.def;if(ok){G.done.push(d.n);const rw={};['perf','boss','peers','rate'].forEach(k=>{if(d[k])rw[k]=d[k];});if(rw.perf&&G.min<t.due-t.lim*.5)rw.perf+=1;gain(rw);Snd.sfx('done');toast(`✅ ${d.ic} ${d.n} 완료!`,'good');}

function failTask(t){const i=G.tasks.indexOf(t);if(i<0)return;G.tasks.splice(i,1);if(t.k==='meet'||t.k==='meetx')endMeeting(t);if(t.k==='chairv'){const c=npcById('chair');if(c)goHome(c);}
 const me=G.me;const carried=t.steps.some(s=>s.carry===me.carry);if(carried)me.carry=null;
 G.failed.push(t.def.n);gain(t.def.pen||{boss:-4,mental:-3});const b=G.ex?npcById('kim'):G.boss;
 if(b&&b.state!=='gone'){say(b,G.ex?`상무님… ${t.def.n} 건 기한이 지났습니다`:pick([`${S.name}씨!! ${t.def.n} 아직도 안 했어?!`,`${t.def.n} 어떻게 됐어? 기한 지났잖아!`]),4500);if(!G.ex){emote(b,'💢');b.mood='angry';later(()=>{if(b)b.mood='';},5000);}}
 toast(`⏰ ${t.def.ic} ${t.def.n} 기한 초과! 실패`,'bad');Snd.sfx('tense');G.shakeUntil=performance.now()+300;
 if(t.k==='report'&&!G.sisal)G.sisal='주간 보고서 미제출';checkFails();}
function checkFails(){if(G.failed.length>=4&&!G.sisal&&!G.ex)G.sisal='업무 처리 지연 (하루 실패 4건 이상)';}
const SPILL=[{at:'mop',t:'탕비실에서 대걸레 가져오기',carry:'mop'},{at:'cooler',t:'바닥 물 닦기',game:'wipe'},{at:'water_stock',t:'생수통 다시 들기',carry:'water'},{at:'cooler',t:'정수기에 꽂기 (재도전)',game:'timing'}];
function afterGame(t,st,ok,val){const me=G.me;
 switch(st.game){
  case'timing':me.carry=null;if(ok){advance(t);Snd.sfx('glug');}else{t.steps.splice(t.step,1,...SPILL.map(s=>Object.assign({},s)));toast('💦 물바다…! 대걸레로 닦고 생수통을 다시 가져와야 해','bad');Snd.sfx('fail');t.due+=25;}break;
  case'wipe':if(ok){me.carry=null;advance(t);}break;

function evNpcId(ev){const nm=(ev.name||'')+(ev.who||'');if(G.ex){if(/회장/.test(nm))return'chair';if(/부장|이사회|감사|노동|검찰|투자/.test(nm))return'kim';return null;}
 if(/김부장|팀장|본부장|부장/.test(nm))return'boss';if(/박과장/.test(nm))return'park';if(/이대리|사수|동료|옆자리/.test(nm))return'lee';if(/신입|최사원/.test(nm))return'choi';if(/동기/.test(nm))return'han';return null;}
function liveEvent(){const ev=pickEvent();if(!ev)return;const id=evNpcId(ev);if(id==='chair')spawnChair();const n=id&&npcById(id);
 if(n&&n.state!=='gone'&&!n.inMeeting){emote(n,'❗',6000);toast(`👀 ${n.name}이(가) 나한테 다가온다…`);G.approach={n,ev,start:G.min,rt:0};standUp();}
 else{toast(`${ev.who} ${ev.name}`);openEvent(ev);}}

/* ---------- 메인 루프 ---------- */
function loop(now){if(!G||!G.active)return;G.raf=requestAnimationFrame(loop);const dt=Math.min(.05,(now-G.last)/1000);G.last=now;
 if(!G.modal)update(dt,now);if(!G||!G.active)return;render(now);if(now-G.hudT>220){G.hudT=now;lvHud();}}
function update(dt,now){const me=G.me;const prevMin=G.min;G.min+=dt*G.rate*G.speed;const dm=G.min-prevMin;
 // 스케줄
 while(G.sched.length&&G.sched[0].t<=G.min){spawnTask(G.sched.shift().k);}
 if(G.evq.length&&G.evq[0].t<=G.min&&!G.approach){G.evq.shift();liveEvent();}
 if(!G.lunch&&G.min>=12*60){G.lunch=true;return lunchTime();}
 if(G.hoesik&&!G.annH&&G.min>=17*60+30){G.annH=true;const b=G.ex?npcById('kim'):G.boss;if(b)say(b,G.ex?'상무님, 오늘 본부 회식 있습니다!':'오늘 회식이다~ 다들 빠지지 마!',5000);toast('🍻 오늘 회식 확정… 퇴근하면 회식 자리로 끌려간다','bad');Snd.sfx('clink');}
 if(!G.ann18&&G.min>=18*60){G.ann18=true;toast('🕕 18:00 퇴근 시간! 출입문으로 가면 퇴근. 남아서 일하면 야근이야','good');}
 if(G.min>=22*60){toast('🌙 22시… 막차 끊기기 전에 강제 퇴근!');return endDay('late');}
 // 기한
 for(const t of G.tasks.slice())if(G.min>t.due)failTask(t);
 // 체력 소모
 G.acc.hp-=dm*.022;G.acc.mental-=dm*.014;
 if(me.state==='rest'){G.acc.hp+=dm*.14;G.acc.mental+=dm*.22;if(roomOf(me.x,me.y)==='pantry')G.pantryMin+=dm;}
 ['hp','mental'].forEach(k=>{if(Math.abs(G.acc[k])>=1){const v=Math.trunc(G.acc[k]);G.acc[k]-=v;S[k]=clamp(S[k]+v,0,100);}});
 if(roomOf(me.x,me.y)==='pantry')G.pantryMin+=me.state==='rest'?0:dm*.6;else G.pantryMin=Math.max(0,G.pantryMin-dm*2);
 // 플레이어 이동
 let vx=0,vy=0;const k=G.keys;if(k.arrowleft||k.a)vx-=1;if(k.arrowright||k.d)vx+=1;if(k.arrowup||k.w)vy-=1;if(k.arrowdown||k.s)vy+=1;
 const spd=me.carry==='water'||me.carry==='box'||me.carry==='paper'?3.0:me.spd;
 if(vx||vy){standUp();me.path=[];me.onArrive=null;const l=Math.hypot(vx,vy);vx/=l;vy/=l;const nx=me.x+vx*spd*dt,ny=me.y+vy*spd*dt;if(canStand(nx,me.y))me.x=nx;if(canStand(me.x,ny))me.y=ny;me.dir=Math.abs(vx)>Math.abs(vy)?(vx>0?'right':'left'):(vy>0?'down':'up');me.moving=true;me.ph+=dt*11;}
 else if(me.path.length){stepPath(me,dt,spd);}else me.moving=false;
 if(!G||!G.active||G.modal)return;
 if(me.moving&&now-G.footT>320){G.footT=now;Snd.sfx('foot');}
 // NPC
 G.npcs.forEach(n=>npcThink(n,dt));
 if(!G||!G.active)return;
 // 접근 이벤트
 if(G.approach){const a=G.approach;a.rt-=dt;if(a.rt<=0){a.rt=.6;if(a.n.state!=='gone')walkTo(a.n,nearPt(me.x,me.y,1.2));}
  if(Math.hypot(a.n.x-me.x,a.n.y-me.y)<1.6||G.min-a.start>45||a.n.state==='gone'){G.approach=null;a.n.path=[];a.n.state='idle';a.n.dir=dirTo(a.n,me);me.dir=dirTo(me,a.n);openEvent(a.ev,a.n);return;}}
 // 순찰 적발
 const b=G.boss;if(b&&b.state==='walk'&&!G.ex){const slack=me.state==='rest'||G.pantryMin>25;if(slack&&G.min>G.catchCD&&Math.hypot(b.x-me.x,b.y-me.y)<4.8&&roomOf(b.x,b.y)===roomOf(me.x,me.y))caught();}
 // 전화벨
 const ph=G.tasks.find(t=>(t.k==='phone'||t.k==='call')&&t.step===0);if(ph&&now-G.ringT>1500){G.ringT=now;Snd.sfx('ring');}
 // fx
 G.fx.forEach(f=>{f.t+=dt;});G.fx=G.fx.filter(f=>f.t<1.6);
 G.near=findNear();
 if(S.hp<=0||S.mental<=0||S.boss<=0)return endDay('collapse');}
function stepPath(e,dt,spd){const tg=e.path[0];const tx=tg.x+.5,ty=tg.y+.5;const dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy),st=spd*dt;
 if(Math.abs(dx)>.01||Math.abs(dy)>.01)e.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');
 if(d<=st){e.x=tx;e.y=ty;e.path.shift();if(!e.path.length){e.moving=false;if(e.state==='walk')e.state='idle';const cb=e.onArrive;e.onArrive=null;if(cb)cb(true);}}
 else{e.x+=dx/d*st;e.y+=dy/d*st;e.moving=true;e.ph+=dt*10;}}
function caught(){const b=G.boss,me=G.me;G.catchCD=G.min+45;G.scolds++;S.stats.scold++;b.path=[];b.state='idle';b.dir=dirTo(b,me);b.mood='angry';
 say(b,pick([`${S.name}씨!! 거기서 뭐 하는 거야?!`,'지금 놀아? 월급 받으면서?!','일 안 하고 여기서 뭐 해!']),4500);emote(b,'💢',4000);me.state='idle';emote(me,'😱');G.pantryMin=0;
 gain({boss:-5,mental:-4});G.shakeUntil=performance.now()+450;Snd.sfx('tense');toast('💢 땡땡이 치다 부장한테 걸렸다!','bad');
 if(G.scolds>=3&&!G.sisal)G.sisal='근무 태만 (근무 중 3회 적발)';later(()=>{if(b&&b.state!=='gone'){b.mood='';b.leaving?goHome(b):goSeat(b);}},3500);}
function npcThink(n,dt){if(n.state==='gone')return;
 if(n.path.length){stepPath(n,dt,n.spd);return;}n.moving=false;
 if(G.approach&&G.approach.n===n)return;if(n.inMeeting||n.visitor)return;
 if(n.leaveAt&&G.min>=n.leaveAt&&!n.leaving){n.leaving=true;say(n,n.id==='boss'?'나 먼저 간다~ 수고해':pick(['먼저 들어가볼게요~','내일 봬요!','칼퇴 성공!']));goHome(n);return;}
 if(n.leaving)return;
 if(n.id==='boss'){if(n.state==='sit'&&G.min>=n.nextPatrol){n.nextPatrol=G.min+R(45,95);const wps=shuffle([[13,6],[17,10],[5,13],[21,9],[14,15],[6,8],[4,12],[26,8],[17,2],[5,5],[3,14]]).slice(0,2);patrol(n,wps);}return;}
 if(n.state==='sit'&&G.min>=n.nextWander){n.nextWander=G.min+R(40,130);const pois=[[2,11],[2,13],[21,8],[3,13],[28,6],[22,8],[16,6],[12,14]];const [x,y]=pick(pois);
  walkTo(n,(a,b)=>a===x&&b===y,()=>{n.state='idle';n.waitUntil=G.min+R(6,22);if(x===28)n.hidden=true;else if(P(.4))say(n,pick(['아 졸려…','커피 수혈 중','오늘 언제 끝나냐']));});}

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function frr(c,x,y,w,h,r,col){c.fillStyle=col;rr(c,x,y,w,h,r);c.fill();}
function circ(c,x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();}
function ell(c,x,y,rx,ry,col){c.fillStyle=col;c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fill();}
function emo(c,t,x,y,s){c.font=`${s}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(t,x,y);}
function ktxt(c,s,x,y,size,col,w=700){c.font=`${w} ${size}px "Noto Sans KR",sans-serif`;c.fillStyle=col;c.textAlign='center';c.textBaseline='middle';c.fillText(s,x,y);}

 G.windows=[];

 case'sofa':{frr(c,x,y+4,w,h-4,9,'#6c5ce7');frr(c,x+5,y+8,w/3-6,h-14,6,'#8b7cf6');frr(c,x+w/3+3,y+8,w/3-6,h-14,6,'#8b7cf6');frr(c,x+2*w/3+1,y+8,w/3-6,h-14,6,'#8b7cf6');break;}

function hair(c,px,hy,L,dir){c.fillStyle=L.hair;const s=L.style;

 if(s==='bald'){c.beginPath();c.arc(px,hy,10.4,.65*Math.PI,1.05*Math.PI);c.lineTo(px-7,hy);c.fill();c.beginPath();c.arc(px,hy,10.4,-.05*Math.PI,.35*Math.PI);c.lineTo(px+7,hy);c.fill();circ(c,px-3,hy-6,2.5,'rgba(255,255,255,.55)');if(dir==='up')circ(c,px,hy+2,8,L.hair);return;}
 c.beginPath();c.arc(px,hy-1,10.6,Math.PI,2*Math.PI);c.fill();
 if(s==='short'){c.fillRect(px-10,hy-2,4,5);c.fillRect(px+6,hy-2,4,5);c.beginPath();c.moveTo(px-9,hy-3);c.quadraticCurveTo(px-2,hy+1,px+6,hy-4);c.lineTo(px+9,hy-6);c.lineTo(px-9,hy-6);c.fill();}
 if(s==='slick'){c.beginPath();c.moveTo(px-10,hy-2);c.quadraticCurveTo(px,hy-9,px+10,hy-1);c.lineTo(px+10,hy-6);c.lineTo(px-10,hy-6);c.fill();}
 if(s==='long'){frr(c,px-11,hy-4,5,18,3,L.hair);frr(c,px+6,hy-4,5,18,3,L.hair);c.fillRect(px-9,hy-6,18,4);}

 if(s==='curly'){for(let i=-2;i<=2;i++)circ(c,px+i*4.5,hy-8+Math.abs(i),4.5,L.hair);}}
